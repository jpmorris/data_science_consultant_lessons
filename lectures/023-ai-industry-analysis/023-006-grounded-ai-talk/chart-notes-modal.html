<!--
  A single, one-off "button below a chart -> modal" pair, for the Knowledge
  Frontier slide's capability chart. Modeled on citations.html's pattern
  (see that file's comment for the full reasoning), but simpler: unlike the
  "Sources" button, this one only ever exists on one slide, so it doesn't
  need the per-slide show/hide-on-slidechange logic -- it's a normal inline
  button living in that slide's own content flow (no position:fixed needed
  for the button itself). The <dialog> still gets appended directly to
  <body>, same as citations.html, because that's the part that actually
  needs to render as a true full-viewport overlay outside reveal.js's
  transform-scaled .slides container.
-->
<script>
(function () {
  function wireUp() {
    var button = document.getElementById('chart-notes-button');
    var template = document.getElementById('chart-notes-template');
    if (!button || !template) return;

    var dialog = document.createElement('dialog');
    dialog.className = 'llm-citations-dialog chart-notes-dialog';

    var header = document.createElement('div');
    header.className = 'llm-citations-dialog-header';
    var title = document.createElement('span');
    title.textContent = 'Why these placements?';
    var closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'llm-citations-dialog-close';
    closeBtn.setAttribute('aria-label', 'Close');
    closeBtn.textContent = '×';
    closeBtn.addEventListener('click', function () { dialog.close(); });
    header.appendChild(title);
    header.appendChild(closeBtn);
    dialog.appendChild(header);

    var body = document.createElement('div');
    body.className = 'llm-citations-dialog-body';
    body.appendChild(template.content.cloneNode(true));
    dialog.appendChild(body);

    dialog.addEventListener('click', function (event) {
      if (event.target === dialog) dialog.close();
    });

    document.body.appendChild(dialog);
    button.addEventListener('click', function () { dialog.showModal(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wireUp);
  } else {
    wireUp();
  }
})();
</script>
