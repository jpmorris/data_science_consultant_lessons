<svg width="860" height="602" viewBox="0 0 1000 700">
  <style>
    .fade { opacity: 0; }
    .s2-title { animation: fadeInStay .4s ease forwards; animation-delay: .1s; }
    .s2-box   { animation: fadeInStay .5s ease forwards; animation-delay: 0s; }
    .s2-early { animation: fadeInStay .4s ease forwards; animation-delay: .15s; }
    .s2-sys   { animation: fadeInStay .6s ease forwards; animation-delay: .5s; }

    @keyframes fadeInStay { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeOutStay { from { opacity: 1; } to { opacity: 0; } }
    @keyframes typeWidth { from { width: 0; } to { width: var(--full-w); } }
    @keyframes cursorMove { from { x: var(--start-x); } to { x: var(--end-x); } }
    @keyframes cursorBlinkOut {
      0%   { opacity: 1; }
      20%  { opacity: 0; }
      40%  { opacity: 1; }
      60%  { opacity: 0; }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }
    /* one quick pulse on the LLM box border per generated token -- every
       tag and every word gets exactly one, no exceptions, since that's
       the whole point: tags aren't special, they're generated the same
       way as everything else. */
    @keyframes boxFlash { 0%, 100% { stroke: #b58900; stroke-width: 3; } 40% { stroke: #eee8d5; stroke-width: 5; } }
    @keyframes panelFlash { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0; } }

    .s2-u1-left { animation: fadeInStay .3s ease forwards; animation-delay: 2.29s; }

    .s2-prompt1 { animation: fadeInStay .1s ease forwards; animation-delay: 1.3s; }
    #s2-type1clip rect { animation: typeWidth .99s steps(18, end) forwards; animation-delay: 1.3s; --full-w: 198px; }
    .s2-cursor1 {
      animation: fadeInStay .05s ease forwards 1.3s,
        cursorMove .99s steps(18, end) forwards 1.3s,
        cursorBlinkOut .8s ease forwards 2.29s;
      --start-x: 622px; --end-x: 820px;
    }

    /* the LLM box itself: initial reveal, then one boxFlash blip per token
       below (35 total: 6 tags + 20 reasoning/summary words + 1 "Answer:"
       label + 8 answer words), each .3s, .4s apart. */
    .s2-llm-box {
      animation: fadeInStay .5s ease forwards 0s,
        boxFlash .3s ease forwards 2.89s, boxFlash .3s ease forwards 3.29s, boxFlash .3s ease forwards 3.69s,
        boxFlash .3s ease forwards 4.09s, boxFlash .3s ease forwards 4.49s, boxFlash .3s ease forwards 4.89s,
        boxFlash .3s ease forwards 5.29s, boxFlash .3s ease forwards 5.69s, boxFlash .3s ease forwards 6.09s,
        boxFlash .3s ease forwards 6.49s, boxFlash .3s ease forwards 6.89s, boxFlash .3s ease forwards 7.29s,
        boxFlash .3s ease forwards 7.69s, boxFlash .3s ease forwards 8.09s, boxFlash .3s ease forwards 8.49s,
        boxFlash .3s ease forwards 8.89s, boxFlash .3s ease forwards 9.29s, boxFlash .3s ease forwards 9.69s,
        boxFlash .3s ease forwards 10.09s, boxFlash .3s ease forwards 10.49s, boxFlash .3s ease forwards 10.89s,
        boxFlash .3s ease forwards 11.29s, boxFlash .3s ease forwards 11.69s, boxFlash .3s ease forwards 12.09s,
        boxFlash .3s ease forwards 12.49s, boxFlash .3s ease forwards 12.89s, boxFlash .3s ease forwards 13.29s,
        boxFlash .3s ease forwards 13.69s, boxFlash .3s ease forwards 14.09s, boxFlash .3s ease forwards 14.49s,
        boxFlash .3s ease forwards 14.89s, boxFlash .3s ease forwards 15.29s, boxFlash .3s ease forwards 15.69s,
        boxFlash .3s ease forwards 16.09s, boxFlash .3s ease forwards 16.49s;
    }

    /* the whole raw-context panel glows (border + faint fill wash over its
       own content) in lockstep with the LLM box, once per token -- makes
       it visually unmistakable that the entire accumulated prompt is what
       flows through the model each time, not just the newest piece. */
    .s2-panel-glow {
      animation:
        panelFlash .3s ease forwards 2.89s, panelFlash .3s ease forwards 3.29s, panelFlash .3s ease forwards 3.69s,
        panelFlash .3s ease forwards 4.09s, panelFlash .3s ease forwards 4.49s, panelFlash .3s ease forwards 4.89s,
        panelFlash .3s ease forwards 5.29s, panelFlash .3s ease forwards 5.69s, panelFlash .3s ease forwards 6.09s,
        panelFlash .3s ease forwards 6.49s, panelFlash .3s ease forwards 6.89s, panelFlash .3s ease forwards 7.29s,
        panelFlash .3s ease forwards 7.69s, panelFlash .3s ease forwards 8.09s, panelFlash .3s ease forwards 8.49s,
        panelFlash .3s ease forwards 8.89s, panelFlash .3s ease forwards 9.29s, panelFlash .3s ease forwards 9.69s,
        panelFlash .3s ease forwards 10.09s, panelFlash .3s ease forwards 10.49s, panelFlash .3s ease forwards 10.89s,
        panelFlash .3s ease forwards 11.29s, panelFlash .3s ease forwards 11.69s, panelFlash .3s ease forwards 12.09s,
        panelFlash .3s ease forwards 12.49s, panelFlash .3s ease forwards 12.89s, panelFlash .3s ease forwards 13.29s,
        panelFlash .3s ease forwards 13.69s, panelFlash .3s ease forwards 14.09s, panelFlash .3s ease forwards 14.49s,
        panelFlash .3s ease forwards 14.89s, panelFlash .3s ease forwards 15.29s, panelFlash .3s ease forwards 15.69s,
        panelFlash .3s ease forwards 16.09s, panelFlash .3s ease forwards 16.49s;
    }

    /* tags -- one token each, same reveal as any word. Delayed .15s after
       the matching panel/box flash above so the flash reads as "sending",
       then the token lands. */
    .s2-tag-open-1  { animation: fadeInStay .25s ease forwards; animation-delay: 3.04s; }
    .s2-tag-close-1 { animation: fadeInStay .25s ease forwards; animation-delay: 6.64s; }
    .s2-sum-open    { animation: fadeInStay .25s ease forwards; animation-delay: 7.04s; }
    .s2-sum-close   { animation: fadeInStay .25s ease forwards; animation-delay: 9.44s; }
    .s2-tag-open-2  { animation: fadeInStay .25s ease forwards; animation-delay: 9.84s; }
    .s2-tag-close-2 { animation: fadeInStay .25s ease forwards; animation-delay: 13.04s; }
    .s2-answer-label { animation: fadeInStay .25s ease forwards; animation-delay: 13.44s; }

    /* reasoning block 1 -- 8 words, one token every .4s */
    .s2-r1w1 { animation: fadeInStay .25s ease forwards; animation-delay: 3.44s; }
    .s2-r1w2 { animation: fadeInStay .25s ease forwards; animation-delay: 3.84s; }
    .s2-r1w3 { animation: fadeInStay .25s ease forwards; animation-delay: 4.24s; }
    .s2-r1w4 { animation: fadeInStay .25s ease forwards; animation-delay: 4.64s; }
    .s2-r1w5 { animation: fadeInStay .25s ease forwards; animation-delay: 5.04s; }
    .s2-r1w6 { animation: fadeInStay .25s ease forwards; animation-delay: 5.44s; }
    .s2-r1w7 { animation: fadeInStay .25s ease forwards; animation-delay: 5.84s; }
    .s2-r1w8 { animation: fadeInStay .25s ease forwards; animation-delay: 6.24s; }

    /* user-facing summary -- 5 words */
    .s2-sw1 { animation: fadeInStay .25s ease forwards; animation-delay: 7.44s; }
    .s2-sw2 { animation: fadeInStay .25s ease forwards; animation-delay: 7.84s; }
    .s2-sw3 { animation: fadeInStay .25s ease forwards; animation-delay: 8.24s; }
    .s2-sw4 { animation: fadeInStay .25s ease forwards; animation-delay: 8.64s; }
    .s2-sw5 { animation: fadeInStay .25s ease forwards; animation-delay: 9.04s; }

    /* reasoning block 2 -- 7 words */
    .s2-r2w1 { animation: fadeInStay .25s ease forwards; animation-delay: 10.24s; }
    .s2-r2w2 { animation: fadeInStay .25s ease forwards; animation-delay: 10.64s; }
    .s2-r2w3 { animation: fadeInStay .25s ease forwards; animation-delay: 11.04s; }
    .s2-r2w4 { animation: fadeInStay .25s ease forwards; animation-delay: 11.44s; }
    .s2-r2w5 { animation: fadeInStay .25s ease forwards; animation-delay: 11.84s; }
    .s2-r2w6 { animation: fadeInStay .25s ease forwards; animation-delay: 12.24s; }
    .s2-r2w7 { animation: fadeInStay .25s ease forwards; animation-delay: 12.64s; }

    /* final answer -- 8 words, left + right panes in lockstep */
    .s2-aw1 { animation: fadeInStay .25s ease forwards; animation-delay: 13.84s; }
    .s2-aw2 { animation: fadeInStay .25s ease forwards; animation-delay: 14.24s; }
    .s2-aw3 { animation: fadeInStay .25s ease forwards; animation-delay: 14.64s; }
    .s2-aw4 { animation: fadeInStay .25s ease forwards; animation-delay: 15.04s; }
    .s2-aw5 { animation: fadeInStay .25s ease forwards; animation-delay: 15.44s; }
    .s2-aw6 { animation: fadeInStay .25s ease forwards; animation-delay: 15.84s; }
    .s2-aw7 { animation: fadeInStay .25s ease forwards; animation-delay: 16.24s; }
    .s2-aw8 { animation: fadeInStay .25s ease forwards; animation-delay: 16.64s; }

    /* terminal: "Thinking..." during both reasoning blocks, the summary
       sentence flashes whole once it's fully generated (never typed, never
       word-by-word -- it's a separate, deliberately user-facing
       generation, unlike the reasoning itself), then the real answer
       streams in word by word once ready. */
    .s2-thinking-1 {
      animation: fadeInStay .3s ease forwards 2.89s, fadeOutStay .2s ease forwards 9.29s;
    }
    .s2-summary-flash {
      animation: fadeInStay .3s ease forwards 9.29s, fadeOutStay .2s ease forwards 9.44s;
    }
    .s2-thinking-2 {
      animation: fadeInStay .3s ease forwards 9.44s, fadeOutStay .2s ease forwards 13.44s;
    }
  </style>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a1a1"/>
    </marker>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="s2-type1clip" clipPathUnits="userSpaceOnUse">
      <rect x="622" y="77" width="0" height="24"/>
    </clipPath>
  </defs>

  <text class="s2-title fade" x="500" y="26" text-anchor="middle" font-size="24" font-weight="700" fill="#b58900">Reasoning-style</text>

  <g transform="translate(0,40)">

  <!-- pane headers + divider -->
  <text class="s2-early fade" x="20" y="35" font-size="24" font-style="italic" fill="#93a1a1">Raw context sent to the model</text>
  <text class="s2-early fade" x="580" y="35" font-size="24" font-style="italic" fill="#93a1a1">What you actually see</text>
  <line class="s2-early fade" x1="560" y1="20" x2="560" y2="650" stroke="#657b7b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT PANE: raw growing context. Every tag and every word is its own
       token, appearing one at a time -- no shortcuts, no whole sentences. -->
  <g class="s2-sys fade">
    <rect x="20" y="48" width="520" height="330" rx="10" fill="#073642" stroke="#268bd2" stroke-width="2"/>
    <text x="40" y="75" font-size="16" font-style="italic" fill="#93a1a1">System: You are a chatbot that answers questions.</text>
  </g>

  <g class="s2-u1-left fade">
    <text x="40" y="102" font-size="20" font-weight="600" fill="#eee8d5">User: How do LLMs work?</text>
  </g>
  <line class="s2-box fade" x1="280" y1="378" x2="280" y2="415" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>

  <rect class="s2-panel-glow fade" x="20" y="48" width="520" height="330" rx="10" fill="#eee8d5" fill-opacity="0.14" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>

  <text class="s2-tag-open-1 fade" x="40" y="129" font-size="16" fill="#6c71c4">&lt;reasoning&gt;</text>
  <text x="55" y="153" font-size="16" font-style="italic" fill="#6c71c4">
    <tspan class="s2-r1w1 fade">I</tspan>
    <tspan class="s2-r1w2 fade"> should</tspan>
    <tspan class="s2-r1w3 fade"> distinguish</tspan>
    <tspan class="s2-r1w4 fade"> large</tspan>
    <tspan class="s2-r1w5 fade"> vs</tspan>
    <tspan class="s2-r1w6 fade"> small</tspan>
    <tspan class="s2-r1w7 fade"> language</tspan>
    <tspan class="s2-r1w8 fade"> models.</tspan>
  </text>
  <text class="s2-tag-close-1 fade" x="40" y="177" font-size="16" fill="#6c71c4">&lt;/reasoning&gt;</text>

  <text class="s2-sum-open fade" x="40" y="201" font-size="16" fill="#6c71c4">&lt;user summary&gt;</text>
  <text x="55" y="225" font-size="16" font-style="italic" fill="#6c71c4">
    <tspan class="s2-sw1 fade">Creating</tspan>
    <tspan class="s2-sw2 fade"> a</tspan>
    <tspan class="s2-sw3 fade"> more</tspan>
    <tspan class="s2-sw4 fade"> detailed</tspan>
    <tspan class="s2-sw5 fade"> definition</tspan>
  </text>
  <text class="s2-sum-close fade" x="40" y="249" font-size="16" fill="#6c71c4">&lt;/user summary&gt;</text>

  <text class="s2-tag-open-2 fade" x="40" y="273" font-size="16" fill="#6c71c4">&lt;reasoning&gt;</text>
  <text x="55" y="297" font-size="16" font-style="italic" fill="#6c71c4">
    <tspan class="s2-r2w1 fade">I</tspan>
    <tspan class="s2-r2w2 fade"> should</tspan>
    <tspan class="s2-r2w3 fade"> distinguish</tspan>
    <tspan class="s2-r2w4 fade"> modern</tspan>
    <tspan class="s2-r2w5 fade"> and</tspan>
    <tspan class="s2-r2w6 fade"> classical</tspan>
    <tspan class="s2-r2w7 fade"> LLMs</tspan>
  </text>
  <text class="s2-tag-close-2 fade" x="40" y="321" font-size="16" fill="#6c71c4">&lt;/reasoning&gt;</text>

  <text x="40" y="348" font-size="18" fill="#2aa198">
    <tspan class="s2-answer-label fade">Answer:</tspan>
    <tspan class="s2-aw1 fade"> They</tspan>
    <tspan class="s2-aw2 fade"> use</tspan>
    <tspan class="s2-aw3 fade"> 'self-attention'</tspan>
    <tspan class="s2-aw4 fade"> to</tspan>
    <tspan class="s2-aw5 fade"> predict</tspan>
    <tspan class="s2-aw6 fade"> the</tspan>
    <tspan class="s2-aw7 fade"> next</tspan>
    <tspan class="s2-aw8 fade"> token.</tspan>
  </text>

  <!-- LLM box -->
  <rect class="s2-llm-box fade" x="210" y="420" width="140" height="90" rx="10" fill="#0d4a55" stroke="#b58900" stroke-width="3"/>
  <text class="s2-box fade" x="280" y="474" text-anchor="middle" font-size="28" font-weight="700" fill="#eee8d5">LLM</text>

  <line class="s2-box fade" x1="280" y1="510" x2="280" y2="565" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- RIGHT PANE: terminal -- never shows reasoning content. "Thinking..."
       during reasoning; the user-facing summary flashes whole; then the
       real answer streams in word by word once ready. -->
  <rect class="s2-early fade" x="580" y="60" width="380" height="200" rx="8" fill="#0a0a0a" stroke="#3a4a4a" stroke-width="2"/>

  <text class="s2-prompt1 fade" x="600" y="95" font-family="'Courier New', monospace" font-size="18" fill="#859900">&gt;</text>
  <text x="622" y="95" font-family="'Courier New', monospace" font-size="18" fill="#eee8d5" clip-path="url(#s2-type1clip)">How do LLMs work?</text>
  <rect class="s2-cursor1 fade" y="77" width="9" height="20" fill="#eee8d5"/>

  <text class="s2-thinking-1 fade" x="600" y="140" font-family="'Courier New', monospace" font-size="18" font-style="italic" fill="#93a1a1">Thinking...</text>
  <text class="s2-summary-flash fade" x="600" y="140" font-family="'Courier New', monospace" font-size="17" fill="#eee8d5">Creating a more detailed definition</text>
  <text class="s2-thinking-2 fade" x="600" y="140" font-family="'Courier New', monospace" font-size="18" font-style="italic" fill="#93a1a1">Thinking...</text>
  <text x="600" y="140" font-family="'Courier New', monospace" font-size="17" fill="#2aa198">
    <tspan class="s2-aw1 fade">They</tspan>
    <tspan class="s2-aw2 fade"> use</tspan>
    <tspan class="s2-aw3 fade"> 'self-attention'</tspan>
    <tspan class="s2-aw4 fade"> to</tspan>
    <tspan class="s2-aw5 fade" x="600" dy="24">predict</tspan>
    <tspan class="s2-aw6 fade"> the</tspan>
    <tspan class="s2-aw7 fade"> next</tspan>
    <tspan class="s2-aw8 fade"> token.</tspan>
  </text>

  </g>
</svg>
