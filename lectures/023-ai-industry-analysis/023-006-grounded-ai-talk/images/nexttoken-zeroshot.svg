<svg width="780" height="445" viewBox="0 0 1000 570">
  <style>
    .fade { opacity: 0; }
    .box   { animation: fadeInStay .5s ease forwards; animation-delay: 0s; }
    .early { animation: fadeInStay .4s ease forwards; animation-delay: .15s; }
    .sys   { animation: fadeInStay .6s ease forwards; animation-delay: .5s; }
    .u1    { animation: fadeInStay .6s ease forwards; animation-delay: 1.3s; }
    .u2    { animation: fadeInStay .4s ease forwards; animation-delay: 11.3s; }
    .arrow2-base { animation: fadeInStay .3s ease forwards; animation-delay: 1.9s; }

    @keyframes fadeInStay { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInOut {
      0%   { opacity: 0; }
      22%  { opacity: 1; }
      78%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blip { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes flashSys  { 0%, 100% { fill: #93a1a1; } 50% { fill: #ffffff; } }
    @keyframes flashUser { 0%, 100% { fill: #eee8d5; } 50% { fill: #ffffff; } }
    @keyframes flashAns  { 0%, 100% { fill: #2aa198; } 50% { fill: #ffffff; } }

    /* text flashes on the LEFT pane only, in sync with each pulse's box
       glow -- the right pane is a passive display and never flashes, which
       is itself part of the point: nothing resends "for" the display. */
    .sys-text   { animation: flashSys .35s ease 2.00s, flashSys .35s ease 3.80s, flashSys .35s ease 5.60s, flashSys .35s ease 7.40s, flashSys .35s ease 9.20s, flashSys .35s ease 12.00s; }
    .user1-text { animation: flashUser .35s ease 2.00s, flashUser .35s ease 3.80s, flashUser .35s ease 5.60s, flashUser .35s ease 7.40s, flashUser .35s ease 9.20s, flashUser .35s ease 12.00s; }
    .user2-text { animation: flashUser .35s ease 12.00s; }
    .answer-label {
      animation: fadeInStay .3s ease forwards 1.9s,
        flashAns .35s ease 2.00s, flashAns .35s ease 3.80s, flashAns .35s ease 5.60s,
        flashAns .35s ease 7.40s, flashAns .35s ease 9.20s, flashAns .35s ease 12.00s;
    }

    /* round 1 -- 5-word generation, full send/process/emit choreography per word */
    .pg1  { animation: blip .35s ease forwards; animation-delay: 2.00s; }
    .a1a1 { animation: blip .25s ease forwards; animation-delay: 2.15s; }
    .a1b1 { animation: blip .25s ease forwards; animation-delay: 2.27s; }
    .a1c1 { animation: blip .25s ease forwards; animation-delay: 2.39s; }
    .lg1  { animation: blip .35s ease forwards; animation-delay: 2.55s; }
    .a2a1 { animation: blip .25s ease forwards; animation-delay: 2.70s; }
    .a2b1 { animation: blip .25s ease forwards; animation-delay: 2.82s; }
    .a2c1 { animation: blip .25s ease forwards; animation-delay: 2.94s; }
    .w1c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 3.10s; }
    .w1a  { animation: fadeInStay .3s ease forwards 3.50s, flashAns .35s ease 3.80s, flashAns .35s ease 5.60s, flashAns .35s ease 7.40s, flashAns .35s ease 9.20s, flashAns .35s ease 12.00s; }
    .wr1a { animation: fadeInStay .3s ease forwards; animation-delay: 3.50s; }

    .pg2  { animation: blip .35s ease forwards; animation-delay: 3.80s; }
    .a1a2 { animation: blip .25s ease forwards; animation-delay: 3.95s; }
    .a1b2 { animation: blip .25s ease forwards; animation-delay: 4.07s; }
    .a1c2 { animation: blip .25s ease forwards; animation-delay: 4.19s; }
    .lg2  { animation: blip .35s ease forwards; animation-delay: 4.35s; }
    .a2a2 { animation: blip .25s ease forwards; animation-delay: 4.50s; }
    .a2b2 { animation: blip .25s ease forwards; animation-delay: 4.62s; }
    .a2c2 { animation: blip .25s ease forwards; animation-delay: 4.74s; }
    .w2c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 4.90s; }
    .w2a  { animation: fadeInStay .3s ease forwards 5.30s, flashAns .35s ease 5.60s, flashAns .35s ease 7.40s, flashAns .35s ease 9.20s, flashAns .35s ease 12.00s; }
    .wr2a { animation: fadeInStay .3s ease forwards; animation-delay: 5.30s; }

    .pg3  { animation: blip .35s ease forwards; animation-delay: 5.60s; }
    .a1a3 { animation: blip .25s ease forwards; animation-delay: 5.75s; }
    .a1b3 { animation: blip .25s ease forwards; animation-delay: 5.87s; }
    .a1c3 { animation: blip .25s ease forwards; animation-delay: 5.99s; }
    .lg3  { animation: blip .35s ease forwards; animation-delay: 6.15s; }
    .a2a3 { animation: blip .25s ease forwards; animation-delay: 6.30s; }
    .a2b3 { animation: blip .25s ease forwards; animation-delay: 6.42s; }
    .a2c3 { animation: blip .25s ease forwards; animation-delay: 6.54s; }
    .w3c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 6.70s; }
    .w3a  { animation: fadeInStay .3s ease forwards 7.10s, flashAns .35s ease 7.40s, flashAns .35s ease 9.20s, flashAns .35s ease 12.00s; }
    .wr3a { animation: fadeInStay .3s ease forwards; animation-delay: 7.10s; }

    .pg4  { animation: blip .35s ease forwards; animation-delay: 7.40s; }
    .a1a4 { animation: blip .25s ease forwards; animation-delay: 7.55s; }
    .a1b4 { animation: blip .25s ease forwards; animation-delay: 7.67s; }
    .a1c4 { animation: blip .25s ease forwards; animation-delay: 7.79s; }
    .lg4  { animation: blip .35s ease forwards; animation-delay: 7.95s; }
    .a2a4 { animation: blip .25s ease forwards; animation-delay: 8.10s; }
    .a2b4 { animation: blip .25s ease forwards; animation-delay: 8.22s; }
    .a2c4 { animation: blip .25s ease forwards; animation-delay: 8.34s; }
    .w4c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 8.50s; }
    .w4a  { animation: fadeInStay .3s ease forwards 8.90s, flashAns .35s ease 9.20s, flashAns .35s ease 12.00s; }
    .wr4a { animation: fadeInStay .3s ease forwards; animation-delay: 8.90s; }

    .pg5  { animation: blip .35s ease forwards; animation-delay: 9.20s; }
    .a1a5 { animation: blip .25s ease forwards; animation-delay: 9.35s; }
    .a1b5 { animation: blip .25s ease forwards; animation-delay: 9.47s; }
    .a1c5 { animation: blip .25s ease forwards; animation-delay: 9.59s; }
    .lg5  { animation: blip .35s ease forwards; animation-delay: 9.75s; }
    .a2a5 { animation: blip .25s ease forwards; animation-delay: 9.90s; }
    .a2b5 { animation: blip .25s ease forwards; animation-delay: 10.02s; }
    .a2c5 { animation: blip .25s ease forwards; animation-delay: 10.14s; }
    .w5c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 10.30s; }
    .w5a  { animation: fadeInStay .3s ease forwards 10.70s, flashAns .35s ease 12.00s; }
    .wr5a { animation: fadeInStay .3s ease forwards; animation-delay: 10.70s; }

    /* round 2 -- second question proves the *whole* box (including round 1)
       re-enters the model. One compressed pulse, whole-phrase answer --
       word-by-word was already taught in round 1. */
    .pgR2 { animation: blip .35s ease forwards; animation-delay: 12.00s; }
    .a1aR2 { animation: blip .25s ease forwards; animation-delay: 12.15s; }
    .a1bR2 { animation: blip .25s ease forwards; animation-delay: 12.27s; }
    .a1cR2 { animation: blip .25s ease forwards; animation-delay: 12.39s; }
    .lgR2 { animation: blip .35s ease forwards; animation-delay: 12.55s; }
    .a2aR2 { animation: blip .25s ease forwards; animation-delay: 12.70s; }
    .a2bR2 { animation: blip .25s ease forwards; animation-delay: 12.82s; }
    .a2cR2 { animation: blip .25s ease forwards; animation-delay: 12.94s; }
    .answer2c { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 13.10s; }
    .answer2a { animation: fadeInStay .3s ease forwards; animation-delay: 13.70s; }
  </style>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a1a1"/>
    </marker>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- pane headers + divider -->
  <text class="early fade" x="20" y="35" font-size="16" font-style="italic" fill="#93a1a1">Raw context sent to the model</text>
  <text class="early fade" x="580" y="35" font-size="16" font-style="italic" fill="#93a1a1">What you actually see</text>
  <text class="early fade" x="580" y="55" font-size="13" font-style="italic" fill="#657b7b">(system prompt not shown)</text>
  <line class="early fade" x1="560" y1="20" x2="560" y2="560" stroke="#657b7b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT PANE: raw growing context -->
  <g class="sys fade">
    <rect x="20" y="48" width="520" height="232" rx="10" fill="#073642" stroke="#268bd2" stroke-width="2"/>
    <text class="sys-text" x="40" y="75" font-size="16" font-style="italic" fill="#93a1a1">System: You are a chatbot that answers questions.</text>
  </g>

  <g class="u1 fade">
    <text class="user1-text" x="40" y="102" font-size="20" font-weight="600" fill="#eee8d5">User: How do LLMs work?</text>
    <line x1="280" y1="280" x2="280" y2="325" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>
  </g>

  <text x="40" y="129" font-size="18" fill="#2aa198">
    <tspan class="answer-label fade">Answer:</tspan>
    <tspan class="w1a fade"> They</tspan>
    <tspan class="w2a fade"> predict</tspan>
    <tspan class="w3a fade"> the</tspan>
    <tspan class="w4a fade"> next</tspan>
    <tspan class="w5a fade"> token.</tspan>
  </text>

  <g class="u2 fade">
    <text class="user2-text" x="40" y="163" font-size="20" font-weight="600" fill="#eee8d5">User: What about hallucinations?</text>
  </g>
  <text class="answer2a fade" x="40" y="190" font-size="18" fill="#2aa198">Answer: They can still be wrong.</text>

  <!-- LLM box (shared by both rounds) -->
  <rect class="box fade" x="210" y="330" width="140" height="90" rx="10" fill="#0d4a55" stroke="#b58900" stroke-width="3"/>
  <text class="box fade" x="280" y="384" text-anchor="middle" font-size="28" font-weight="700" fill="#eee8d5">LLM</text>

  <line class="arrow2-base fade" x1="280" y1="420" x2="280" y2="475" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- completion slot (shared by both rounds) -->
  <text class="w1c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">They</text>
  <text class="w2c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">predict</text>
  <text class="w3c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">the</text>
  <text class="w4c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">next</text>
  <text class="w5c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">token.</text>
  <text class="answer2c fade" x="280" y="515" text-anchor="middle" font-size="22" font-style="italic" fill="#b58900">They can still be wrong.</text>

  <!-- RIGHT PANE: chat UI, no system prompt, bubbles only -->
  <g class="u1 fade">
    <rect x="580" y="75" width="380" height="46" rx="14" fill="#073642" stroke="#268bd2" stroke-width="2"/>
    <text x="600" y="104" font-size="18" fill="#eee8d5">How do LLMs work?</text>
  </g>

  <g class="fade" style="animation: fadeInStay .4s ease forwards; animation-delay: 3.5s;">
    <rect x="580" y="133" width="380" height="46" rx="14" fill="#073642" stroke="#2aa198" stroke-width="2"/>
  </g>
  <text x="600" y="162" font-size="18" fill="#2aa198">
    <tspan class="wr1a fade">They</tspan>
    <tspan class="wr2a fade"> predict</tspan>
    <tspan class="wr3a fade"> the</tspan>
    <tspan class="wr4a fade"> next</tspan>
    <tspan class="wr5a fade"> token.</tspan>
  </text>

  <g class="u2 fade">
    <rect x="580" y="191" width="380" height="46" rx="14" fill="#073642" stroke="#268bd2" stroke-width="2"/>
    <text x="600" y="220" font-size="18" fill="#eee8d5">What about hallucinations?</text>
  </g>

  <g class="answer2a fade">
    <rect x="580" y="249" width="380" height="46" rx="14" fill="#073642" stroke="#2aa198" stroke-width="2"/>
    <text x="600" y="278" font-size="18" fill="#2aa198">They can still be wrong.</text>
  </g>

  <!-- per-cycle flow indicators -->
  <g id="flow-pulses">
    <rect class="pg1 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg2 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg3 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg4 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg5 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pgR2 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>

    <rect class="lg1 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg2 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg3 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg4 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg5 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lgR2 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>

    <circle class="a1a1 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b1 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c1 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1a2 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b2 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c2 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1a3 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b3 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c3 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1a4 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b4 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c4 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1a5 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b5 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c5 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1aR2 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1bR2 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1cR2 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>

    <circle class="a2a1 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b1 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c1 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2a2 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b2 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c2 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2a3 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b3 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c3 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2a4 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b4 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c4 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2a5 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b5 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c5 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2aR2 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2bR2 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2cR2 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
  </g>
</svg>
