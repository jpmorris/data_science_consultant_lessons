<svg width="560" height="360" viewBox="0 0 700 450">
  <style>
    .fade { opacity: 0; }
    .box        { animation: fadeInStay .5s ease forwards; animation-delay: 0s; }
    .sys        { animation: fadeInStay .6s ease forwards; animation-delay: .5s; }
    .user-turn  { animation: fadeInStay .6s ease forwards; animation-delay: 1.3s; }
    .arrow2-base { animation: fadeInStay .3s ease forwards; animation-delay: 1.9s; }

    /* text flashes in sync with each cycle's box glow (.pg{n}) -- present
       from the start, so it flashes on every cycle */
    .sys-text, .user-text {
      animation:
        flashSys .35s ease 2.00s, flashSys .35s ease 3.80s, flashSys .35s ease 5.60s,
        flashSys .35s ease 7.40s, flashSys .35s ease 9.20s;
    }
    .user-text {
      animation-name: flashUser, flashUser, flashUser, flashUser, flashUser;
    }

    /* answer words flash on every cycle *after* they've folded into the
       prompt -- they're part of "the whole prompt" being re-sent from
       that point on, so they keep flashing right alongside sys/user text.
       (no flash at each word's own delay -- that moment is its fade-in,
       not a resend.) */
    .answer-label {
      animation: fadeInStay .3s ease forwards 1.9s,
        flashAns .35s ease 2.00s, flashAns .35s ease 3.80s, flashAns .35s ease 5.60s,
        flashAns .35s ease 7.40s, flashAns .35s ease 9.20s;
    }

    @keyframes fadeInStay {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fadeInOut {
      0%   { opacity: 0; }
      22%  { opacity: 1; }
      78%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blip {
      0%   { opacity: 0; }
      40%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes flashSys  { 0%, 100% { fill: #93a1a1; } 50% { fill: #ffffff; } }
    @keyframes flashUser { 0%, 100% { fill: #eee8d5; } 50% { fill: #ffffff; } }
    @keyframes flashAns  { 0%, 100% { fill: #2aa198; } 50% { fill: #ffffff; } }

    /* cycle 1 -- delays anchored at loop start 2.00s */
    .pg1  { animation: blip .35s ease forwards; animation-delay: 2.00s; }
    .a1a1 { animation: blip .25s ease forwards; animation-delay: 2.15s; }
    .a1b1 { animation: blip .25s ease forwards; animation-delay: 2.27s; }
    .a1c1 { animation: blip .25s ease forwards; animation-delay: 2.39s; }
    .lg1  { animation: blip .35s ease forwards; animation-delay: 2.55s; }
    .a2a1 { animation: blip .25s ease forwards; animation-delay: 2.70s; }
    .a2b1 { animation: blip .25s ease forwards; animation-delay: 2.82s; }
    .a2c1 { animation: blip .25s ease forwards; animation-delay: 2.94s; }
    .w1c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 3.10s; }
    .w1a  {
      animation: fadeInStay .3s ease forwards 3.50s,
        flashAns .35s ease 3.80s, flashAns .35s ease 5.60s,
        flashAns .35s ease 7.40s, flashAns .35s ease 9.20s;
    }

    /* cycle 2 -- anchored at 3.80s */
    .pg2  { animation: blip .35s ease forwards; animation-delay: 3.80s; }
    .a1a2 { animation: blip .25s ease forwards; animation-delay: 3.95s; }
    .a1b2 { animation: blip .25s ease forwards; animation-delay: 4.07s; }
    .a1c2 { animation: blip .25s ease forwards; animation-delay: 4.19s; }
    .lg2  { animation: blip .35s ease forwards; animation-delay: 4.35s; }
    .a2a2 { animation: blip .25s ease forwards; animation-delay: 4.50s; }
    .a2b2 { animation: blip .25s ease forwards; animation-delay: 4.62s; }
    .a2c2 { animation: blip .25s ease forwards; animation-delay: 4.74s; }
    .w2c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 4.90s; }
    .w2a  {
      animation: fadeInStay .3s ease forwards 5.30s,
        flashAns .35s ease 5.60s, flashAns .35s ease 7.40s, flashAns .35s ease 9.20s;
    }

    /* cycle 3 -- anchored at 5.60s */
    .pg3  { animation: blip .35s ease forwards; animation-delay: 5.60s; }
    .a1a3 { animation: blip .25s ease forwards; animation-delay: 5.75s; }
    .a1b3 { animation: blip .25s ease forwards; animation-delay: 5.87s; }
    .a1c3 { animation: blip .25s ease forwards; animation-delay: 5.99s; }
    .lg3  { animation: blip .35s ease forwards; animation-delay: 6.15s; }
    .a2a3 { animation: blip .25s ease forwards; animation-delay: 6.30s; }
    .a2b3 { animation: blip .25s ease forwards; animation-delay: 6.42s; }
    .a2c3 { animation: blip .25s ease forwards; animation-delay: 6.54s; }
    .w3c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 6.70s; }
    .w3a  {
      animation: fadeInStay .3s ease forwards 7.10s,
        flashAns .35s ease 7.40s, flashAns .35s ease 9.20s;
    }

    /* cycle 4 -- anchored at 7.40s */
    .pg4  { animation: blip .35s ease forwards; animation-delay: 7.40s; }
    .a1a4 { animation: blip .25s ease forwards; animation-delay: 7.55s; }
    .a1b4 { animation: blip .25s ease forwards; animation-delay: 7.67s; }
    .a1c4 { animation: blip .25s ease forwards; animation-delay: 7.79s; }
    .lg4  { animation: blip .35s ease forwards; animation-delay: 7.95s; }
    .a2a4 { animation: blip .25s ease forwards; animation-delay: 8.10s; }
    .a2b4 { animation: blip .25s ease forwards; animation-delay: 8.22s; }
    .a2c4 { animation: blip .25s ease forwards; animation-delay: 8.34s; }
    .w4c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 8.50s; }
    .w4a  {
      animation: fadeInStay .3s ease forwards 8.90s,
        flashAns .35s ease 9.20s;
    }

    /* cycle 5 -- anchored at 9.20s */
    .pg5  { animation: blip .35s ease forwards; animation-delay: 9.20s; }
    .a1a5 { animation: blip .25s ease forwards; animation-delay: 9.35s; }
    .a1b5 { animation: blip .25s ease forwards; animation-delay: 9.47s; }
    .a1c5 { animation: blip .25s ease forwards; animation-delay: 9.59s; }
    .lg5  { animation: blip .35s ease forwards; animation-delay: 9.75s; }
    .a2a5 { animation: blip .25s ease forwards; animation-delay: 9.90s; }
    .a2b5 { animation: blip .25s ease forwards; animation-delay: 10.02s; }
    .a2c5 { animation: blip .25s ease forwards; animation-delay: 10.14s; }
    .w5c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 10.30s; }
    .w5a  { animation: fadeInStay .3s ease forwards; animation-delay: 10.70s; }
  </style>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a1a1"/>
    </marker>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- prompt panel: system + user + growing answer completion. Stays fully
       legible throughout -- the glow pulses below signal "this whole box
       flows into the model again," not "this content goes away." -->
  <g class="sys fade">
    <rect x="40" y="20" width="620" height="140" rx="10" fill="#073642" stroke="#268bd2" stroke-width="2"/>
    <text class="sys-text" x="60" y="55" font-size="18" font-style="italic" fill="#93a1a1">System: You are a chatbot that answers questions.</text>
  </g>

  <g class="user-turn fade">
    <text class="user-text" x="60" y="95" font-size="22" font-weight="600" fill="#eee8d5">User: How do LLMs work?</text>
    <line x1="350" y1="160" x2="350" y2="215" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>
  </g>

  <text x="60" y="135" font-size="20" fill="#2aa198">
    <tspan class="answer-label fade">Answer:</tspan>
    <tspan class="w1a fade"> They</tspan>
    <tspan class="w2a fade"> predict</tspan>
    <tspan class="w3a fade"> the</tspan>
    <tspan class="w4a fade"> next</tspan>
    <tspan class="w5a fade"> token.</tspan>
  </text>

  <!-- LLM box -->
  <rect class="box fade" x="280" y="220" width="140" height="90" rx="10" fill="#0d4a55" stroke="#b58900" stroke-width="3"/>
  <text class="box fade" x="350" y="274" text-anchor="middle" font-size="28" font-weight="700" fill="#eee8d5">LLM</text>

  <line class="arrow2-base fade" x1="350" y1="310" x2="350" y2="365" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- completion slot: one word visible at a time -->
  <text class="w1c fade" x="350" y="410" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">They</text>
  <text class="w2c fade" x="350" y="410" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">predict</text>
  <text class="w3c fade" x="350" y="410" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">the</text>
  <text class="w4c fade" x="350" y="410" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">next</text>
  <text class="w5c fade" x="350" y="410" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">token.</text>

  <!-- per-cycle flow indicators: box glow -> dots down arrow1 -> LLM glow ->
       dots down arrow2. Repeated once per generated word so it's clear the
       *entire* prompt (including words already folded in) is re-sent every
       time, not just that a new word appears. -->
  <g id="flow-pulses">
    <rect class="pg1 fade" x="40" y="20" width="620" height="140" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg2 fade" x="40" y="20" width="620" height="140" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg3 fade" x="40" y="20" width="620" height="140" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg4 fade" x="40" y="20" width="620" height="140" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg5 fade" x="40" y="20" width="620" height="140" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>

    <rect class="lg1 fade" x="280" y="220" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg2 fade" x="280" y="220" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg3 fade" x="280" y="220" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg4 fade" x="280" y="220" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg5 fade" x="280" y="220" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>

    <circle class="a1a1 fade" cx="350" cy="175" r="7" fill="#eee8d5"/>
    <circle class="a1b1 fade" cx="350" cy="190" r="7" fill="#eee8d5"/>
    <circle class="a1c1 fade" cx="350" cy="205" r="7" fill="#eee8d5"/>
    <circle class="a1a2 fade" cx="350" cy="175" r="7" fill="#eee8d5"/>
    <circle class="a1b2 fade" cx="350" cy="190" r="7" fill="#eee8d5"/>
    <circle class="a1c2 fade" cx="350" cy="205" r="7" fill="#eee8d5"/>
    <circle class="a1a3 fade" cx="350" cy="175" r="7" fill="#eee8d5"/>
    <circle class="a1b3 fade" cx="350" cy="190" r="7" fill="#eee8d5"/>
    <circle class="a1c3 fade" cx="350" cy="205" r="7" fill="#eee8d5"/>
    <circle class="a1a4 fade" cx="350" cy="175" r="7" fill="#eee8d5"/>
    <circle class="a1b4 fade" cx="350" cy="190" r="7" fill="#eee8d5"/>
    <circle class="a1c4 fade" cx="350" cy="205" r="7" fill="#eee8d5"/>
    <circle class="a1a5 fade" cx="350" cy="175" r="7" fill="#eee8d5"/>
    <circle class="a1b5 fade" cx="350" cy="190" r="7" fill="#eee8d5"/>
    <circle class="a1c5 fade" cx="350" cy="205" r="7" fill="#eee8d5"/>

    <circle class="a2a1 fade" cx="350" cy="325" r="7" fill="#eee8d5"/>
    <circle class="a2b1 fade" cx="350" cy="340" r="7" fill="#eee8d5"/>
    <circle class="a2c1 fade" cx="350" cy="355" r="7" fill="#eee8d5"/>
    <circle class="a2a2 fade" cx="350" cy="325" r="7" fill="#eee8d5"/>
    <circle class="a2b2 fade" cx="350" cy="340" r="7" fill="#eee8d5"/>
    <circle class="a2c2 fade" cx="350" cy="355" r="7" fill="#eee8d5"/>
    <circle class="a2a3 fade" cx="350" cy="325" r="7" fill="#eee8d5"/>
    <circle class="a2b3 fade" cx="350" cy="340" r="7" fill="#eee8d5"/>
    <circle class="a2c3 fade" cx="350" cy="355" r="7" fill="#eee8d5"/>
    <circle class="a2a4 fade" cx="350" cy="325" r="7" fill="#eee8d5"/>
    <circle class="a2b4 fade" cx="350" cy="340" r="7" fill="#eee8d5"/>
    <circle class="a2c4 fade" cx="350" cy="355" r="7" fill="#eee8d5"/>
    <circle class="a2a5 fade" cx="350" cy="325" r="7" fill="#eee8d5"/>
    <circle class="a2b5 fade" cx="350" cy="340" r="7" fill="#eee8d5"/>
    <circle class="a2c5 fade" cx="350" cy="355" r="7" fill="#eee8d5"/>
  </g>
</svg>
