<svg width="560" height="384" viewBox="0 0 700 480">
  <style>
    .fade { opacity: 0; }
    .box        { animation: fadeInStay .5s ease forwards; animation-delay: 0s; }
    .sys        { animation: fadeInStay .6s ease forwards; animation-delay: .5s; }
    .user-turn  { animation: fadeInStay .6s ease forwards; animation-delay: 1.3s; }
    .arrow2     { animation: fadeInStay .4s ease forwards; animation-delay: 2.1s; }
    .w1c { animation: fadeInOut .9s ease-in-out forwards; animation-delay: 2.1s; }
    .w1a { animation: fadeInStay .4s ease forwards; animation-delay: 3.0s; }
    .w2c { animation: fadeInOut .9s ease-in-out forwards; animation-delay: 3.5s; }
    .w2a { animation: fadeInStay .4s ease forwards; animation-delay: 4.4s; }
    .w3c { animation: fadeInOut .9s ease-in-out forwards; animation-delay: 4.9s; }
    .w3a { animation: fadeInStay .4s ease forwards; animation-delay: 5.8s; }
    .w4c { animation: fadeInOut .9s ease-in-out forwards; animation-delay: 6.3s; }
    .w4a { animation: fadeInStay .4s ease forwards; animation-delay: 7.2s; }
    .w5c { animation: fadeInOut .9s ease-in-out forwards; animation-delay: 7.7s; }
    .w5a { animation: fadeInStay .4s ease forwards; animation-delay: 8.6s; }
    @keyframes fadeInStay {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes fadeInOut {
      0%   { opacity: 0; }
      22%  { opacity: 1; }
      78%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a1a1"/>
    </marker>
  </defs>

  <!-- prompt panel: system + user + growing assistant completion -->
  <g class="sys fade">
    <rect x="40" y="20" width="620" height="170" rx="10" fill="#073642" stroke="#268bd2" stroke-width="2"/>
    <text x="60" y="52" font-size="18" font-style="italic" fill="#93a1a1">System: You are a chatbot that answers</text>
    <text x="60" y="74" font-size="18" font-style="italic" fill="#93a1a1">questions about how LLMs work.</text>
  </g>

  <g class="user-turn fade">
    <text x="60" y="108" font-size="22" font-weight="600" fill="#eee8d5">User: How do LLMs work?</text>
    <line x1="350" y1="190" x2="350" y2="245" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>
  </g>

  <text x="60" y="148" font-size="20" fill="#2aa198">
    <tspan class="fade" style="animation: fadeInStay .4s ease forwards; animation-delay: 3.0s;">Assistant:</tspan>
    <tspan class="w1a fade"> They</tspan>
    <tspan class="w2a fade"> predict</tspan>
    <tspan class="w3a fade"> the</tspan>
    <tspan class="w4a fade"> next</tspan>
    <tspan class="w5a fade"> token.</tspan>
  </text>

  <!-- LLM box -->
  <rect class="box fade" x="280" y="250" width="140" height="90" rx="10" fill="#0d4a55" stroke="#b58900" stroke-width="3"/>
  <text class="box fade" x="350" y="304" text-anchor="middle" font-size="28" font-weight="700" fill="#eee8d5">LLM</text>

  <line class="arrow2 fade" x1="350" y1="340" x2="350" y2="395" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- completion slot: one word visible at a time -->
  <text class="w1c fade" x="350" y="440" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">They</text>
  <text class="w2c fade" x="350" y="440" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">predict</text>
  <text class="w3c fade" x="350" y="440" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">the</text>
  <text class="w4c fade" x="350" y="440" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">next</text>
  <text class="w5c fade" x="350" y="440" text-anchor="middle" font-size="26" font-style="italic" fill="#b58900">token.</text>
</svg>
