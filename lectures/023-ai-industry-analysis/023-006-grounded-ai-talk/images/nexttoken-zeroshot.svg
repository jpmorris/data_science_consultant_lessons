<svg width="780" height="445" viewBox="0 0 1000 570">
  <style>
    .fade { opacity: 0; }
    .box   { animation: fadeInStay .5s ease forwards; animation-delay: 0s; }
    .early { animation: fadeInStay .4s ease forwards; animation-delay: .15s; }
    .sys   { animation: fadeInStay .6s ease forwards; animation-delay: .5s; }
    .arrow2-base { animation: fadeInStay .3s ease forwards; animation-delay: 2.59s; }

    @keyframes fadeInStay { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInOut {
      0%   { opacity: 0; }
      22%  { opacity: 1; }
      78%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes blip { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes flashSys  { 0%, 100% { fill: #93a1a1; } 50% { fill: #ffffff; } }
    @keyframes flashUser { 0%, 100% { fill: #eee8d5; } 50% { fill: #ffffff; } }
    @keyframes flashAns  { 0%, 100% { fill: #2aa198; } 50% { fill: #ffffff; } }
    @keyframes typeWidth { from { width: 0; } to { width: var(--full-w); } }
    @keyframes cursorMove { from { x: var(--start-x); } to { x: var(--end-x); } }
    @keyframes cursorBlinkOut {
      0%   { opacity: 1; }
      20%  { opacity: 0; }
      40%  { opacity: 1; }
      60%  { opacity: 0; }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* left-pane-only text flashes, in sync with each pulse's box glow */
    .sys-text   { animation: flashSys .35s ease 3.20s, flashSys .35s ease 5.00s, flashSys .35s ease 6.80s, flashSys .35s ease 8.60s, flashSys .35s ease 10.40s, flashSys .35s ease 14.60s; }
    .user1-text { animation: flashUser .35s ease 3.20s, flashUser .35s ease 5.00s, flashUser .35s ease 6.80s, flashUser .35s ease 8.60s, flashUser .35s ease 10.40s, flashUser .35s ease 14.60s; }
    .user2-text { animation: flashUser .35s ease 14.60s; }
    .answer-label {
      animation: fadeInStay .3s ease forwards 2.59s,
        flashAns .35s ease 3.20s, flashAns .35s ease 5.00s, flashAns .35s ease 6.80s,
        flashAns .35s ease 8.60s, flashAns .35s ease 10.40s, flashAns .35s ease 14.60s;
    }

    /* left reveals: the model only ever sees the whole line at once, the
       moment typing finishes on the terminal (right pane) -- never a typing
       effect on this side. */
    .u1-left { animation: fadeInStay .3s ease forwards; animation-delay: 2.29s; }
    .u2-left { animation: fadeInStay .3s ease forwards; animation-delay: 13.99s; }

    /* terminal typing: prompt symbol appears instantly, then the typed text
       reveals character-by-character (steps = char count) while a block
       cursor tracks it, then the cursor blinks a couple times and hides --
       the "cursor only for user input" rule from the brief. */
    .prompt1 { animation: fadeInStay .1s ease forwards; animation-delay: 1.3s; }
    #type1clip rect { animation: typeWidth .99s steps(18, end) forwards; animation-delay: 1.3s; --full-w: 198px; }
    .cursor1 {
      animation: fadeInStay .05s ease forwards 1.3s,
        cursorMove .99s steps(18, end) forwards 1.3s,
        cursorBlinkOut .8s ease forwards 2.29s;
      --start-x: 622px; --end-x: 820px;
    }

    .prompt2 { animation: fadeInStay .1s ease forwards; animation-delay: 12.50s; }
    #type2clip rect { animation: typeWidth 1.485s steps(27, end) forwards; animation-delay: 12.50s; --full-w: 297px; }
    .cursor2 {
      animation: fadeInStay .05s ease forwards 12.50s,
        cursorMove 1.485s steps(27, end) forwards 12.50s,
        cursorBlinkOut .8s ease forwards 13.99s;
      --start-x: 622px; --end-x: 919px;
    }

    /* round 1 -- 5-word generation, full send/process/emit choreography per word */
    .pg1  { animation: blip .35s ease forwards; animation-delay: 3.20s; }
    .a1a1 { animation: blip .25s ease forwards; animation-delay: 3.35s; }
    .a1b1 { animation: blip .25s ease forwards; animation-delay: 3.47s; }
    .a1c1 { animation: blip .25s ease forwards; animation-delay: 3.59s; }
    .lg1  { animation: blip .35s ease forwards; animation-delay: 3.75s; }
    .a2a1 { animation: blip .25s ease forwards; animation-delay: 3.90s; }
    .a2b1 { animation: blip .25s ease forwards; animation-delay: 4.02s; }
    .a2c1 { animation: blip .25s ease forwards; animation-delay: 4.14s; }
    .w1c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 4.30s; }
    .w1a  { animation: fadeInStay .3s ease forwards 4.70s, flashAns .35s ease 5.00s, flashAns .35s ease 6.80s, flashAns .35s ease 8.60s, flashAns .35s ease 10.40s, flashAns .35s ease 14.60s; }
    .wr1a { animation: fadeInStay .3s ease forwards; animation-delay: 4.70s; }

    .pg2  { animation: blip .35s ease forwards; animation-delay: 5.00s; }
    .a1a2 { animation: blip .25s ease forwards; animation-delay: 5.15s; }
    .a1b2 { animation: blip .25s ease forwards; animation-delay: 5.27s; }
    .a1c2 { animation: blip .25s ease forwards; animation-delay: 5.39s; }
    .lg2  { animation: blip .35s ease forwards; animation-delay: 5.55s; }
    .a2a2 { animation: blip .25s ease forwards; animation-delay: 5.70s; }
    .a2b2 { animation: blip .25s ease forwards; animation-delay: 5.82s; }
    .a2c2 { animation: blip .25s ease forwards; animation-delay: 5.94s; }
    .w2c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 6.10s; }
    .w2a  { animation: fadeInStay .3s ease forwards 6.50s, flashAns .35s ease 6.80s, flashAns .35s ease 8.60s, flashAns .35s ease 10.40s, flashAns .35s ease 14.60s; }
    .wr2a { animation: fadeInStay .3s ease forwards; animation-delay: 6.50s; }

    .pg3  { animation: blip .35s ease forwards; animation-delay: 6.80s; }
    .a1a3 { animation: blip .25s ease forwards; animation-delay: 6.95s; }
    .a1b3 { animation: blip .25s ease forwards; animation-delay: 7.07s; }
    .a1c3 { animation: blip .25s ease forwards; animation-delay: 7.19s; }
    .lg3  { animation: blip .35s ease forwards; animation-delay: 7.35s; }
    .a2a3 { animation: blip .25s ease forwards; animation-delay: 7.50s; }
    .a2b3 { animation: blip .25s ease forwards; animation-delay: 7.62s; }
    .a2c3 { animation: blip .25s ease forwards; animation-delay: 7.74s; }
    .w3c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 7.90s; }
    .w3a  { animation: fadeInStay .3s ease forwards 8.30s, flashAns .35s ease 8.60s, flashAns .35s ease 10.40s, flashAns .35s ease 14.60s; }
    .wr3a { animation: fadeInStay .3s ease forwards; animation-delay: 8.30s; }

    .pg4  { animation: blip .35s ease forwards; animation-delay: 8.60s; }
    .a1a4 { animation: blip .25s ease forwards; animation-delay: 8.75s; }
    .a1b4 { animation: blip .25s ease forwards; animation-delay: 8.87s; }
    .a1c4 { animation: blip .25s ease forwards; animation-delay: 8.99s; }
    .lg4  { animation: blip .35s ease forwards; animation-delay: 9.15s; }
    .a2a4 { animation: blip .25s ease forwards; animation-delay: 9.30s; }
    .a2b4 { animation: blip .25s ease forwards; animation-delay: 9.42s; }
    .a2c4 { animation: blip .25s ease forwards; animation-delay: 9.54s; }
    .w4c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 9.70s; }
    .w4a  { animation: fadeInStay .3s ease forwards 10.10s, flashAns .35s ease 10.40s, flashAns .35s ease 14.60s; }
    .wr4a { animation: fadeInStay .3s ease forwards; animation-delay: 10.10s; }

    .pg5  { animation: blip .35s ease forwards; animation-delay: 10.40s; }
    .a1a5 { animation: blip .25s ease forwards; animation-delay: 10.55s; }
    .a1b5 { animation: blip .25s ease forwards; animation-delay: 10.67s; }
    .a1c5 { animation: blip .25s ease forwards; animation-delay: 10.79s; }
    .lg5  { animation: blip .35s ease forwards; animation-delay: 10.95s; }
    .a2a5 { animation: blip .25s ease forwards; animation-delay: 11.10s; }
    .a2b5 { animation: blip .25s ease forwards; animation-delay: 11.22s; }
    .a2c5 { animation: blip .25s ease forwards; animation-delay: 11.34s; }
    .w5c  { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 11.50s; }
    .w5a  { animation: fadeInStay .3s ease forwards 11.90s, flashAns .35s ease 14.60s; }
    .wr5a { animation: fadeInStay .3s ease forwards; animation-delay: 11.90s; }

    /* round 2 -- single compressed pulse, whole-phrase answer */
    .pgR2 { animation: blip .35s ease forwards; animation-delay: 14.60s; }
    .a1aR2 { animation: blip .25s ease forwards; animation-delay: 14.75s; }
    .a1bR2 { animation: blip .25s ease forwards; animation-delay: 14.87s; }
    .a1cR2 { animation: blip .25s ease forwards; animation-delay: 14.99s; }
    .lgR2 { animation: blip .35s ease forwards; animation-delay: 15.15s; }
    .a2aR2 { animation: blip .25s ease forwards; animation-delay: 15.30s; }
    .a2bR2 { animation: blip .25s ease forwards; animation-delay: 15.42s; }
    .a2cR2 { animation: blip .25s ease forwards; animation-delay: 15.54s; }
    .answer2c { animation: fadeInOut .6s ease-in-out forwards; animation-delay: 15.70s; }
    .answer2a { animation: fadeInStay .3s ease forwards; animation-delay: 16.30s; }
  </style>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a1a1"/>
    </marker>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="type1clip" clipPathUnits="userSpaceOnUse">
      <rect x="622" y="85" width="0" height="24"/>
    </clipPath>
    <clipPath id="type2clip" clipPathUnits="userSpaceOnUse">
      <rect x="622" y="150" width="0" height="24"/>
    </clipPath>
  </defs>

  <!-- pane headers + divider -->
  <text class="early fade" x="20" y="35" font-size="16" font-style="italic" fill="#93a1a1">Raw context sent to the model</text>
  <text class="early fade" x="580" y="35" font-size="16" font-style="italic" fill="#93a1a1">What you actually see</text>
  <text class="early fade" x="580" y="55" font-size="13" font-style="italic" fill="#657b7b">(system prompt not shown)</text>
  <line class="early fade" x1="560" y1="20" x2="560" y2="560" stroke="#657b7b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT PANE: raw growing context -->
  <g class="sys fade">
    <rect x="20" y="48" width="520" height="232" rx="10" fill="#073642" stroke="#268bd2" stroke-width="2"/>
    <text class="sys-text" x="40" y="75" font-size="16" font-style="italic" fill="#93a1a1">System: You are a chatbot that answers questions.</text>
  </g>

  <g class="u1-left fade">
    <text class="user1-text" x="40" y="102" font-size="20" font-weight="600" fill="#eee8d5">User: How do LLMs work?</text>
    <line x1="280" y1="280" x2="280" y2="325" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>
  </g>

  <text x="40" y="129" font-size="18" fill="#2aa198">
    <tspan class="answer-label fade">Answer:</tspan>
    <tspan class="w1a fade"> They</tspan>
    <tspan class="w2a fade"> predict</tspan>
    <tspan class="w3a fade"> the</tspan>
    <tspan class="w4a fade"> next</tspan>
    <tspan class="w5a fade"> token.</tspan>
  </text>

  <g class="u2-left fade">
    <text class="user2-text" x="40" y="163" font-size="20" font-weight="600" fill="#eee8d5">User: What about hallucinations?</text>
  </g>
  <text class="answer2a fade" x="40" y="190" font-size="18" fill="#2aa198">Answer: They can still be wrong.</text>

  <!-- LLM box (shared by both rounds) -->
  <rect class="box fade" x="210" y="330" width="140" height="90" rx="10" fill="#0d4a55" stroke="#b58900" stroke-width="3"/>
  <text class="box fade" x="280" y="384" text-anchor="middle" font-size="28" font-weight="700" fill="#eee8d5">LLM</text>

  <line class="arrow2-base fade" x1="280" y1="420" x2="280" y2="475" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrowDown)"/>

  <!-- completion slot (shared by both rounds) -->
  <text class="w1c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">They</text>
  <text class="w2c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">predict</text>
  <text class="w3c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">the</text>
  <text class="w4c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">next</text>
  <text class="w5c fade" x="280" y="515" text-anchor="middle" font-size="24" font-style="italic" fill="#b58900">token.</text>
  <text class="answer2c fade" x="280" y="515" text-anchor="middle" font-size="22" font-style="italic" fill="#b58900">They can still be wrong.</text>

  <!-- RIGHT PANE: single terminal window, monospace, black -->
  <rect class="early fade" x="580" y="75" width="380" height="150" rx="8" fill="#0a0a0a" stroke="#3a4a4a" stroke-width="2"/>

  <!-- line 1: typed question 1, with tracking cursor -->
  <text class="prompt1 fade" x="600" y="105" font-family="'Courier New', monospace" font-size="18" fill="#859900">&gt;</text>
  <text x="622" y="105" font-family="'Courier New', monospace" font-size="18" fill="#eee8d5" clip-path="url(#type1clip)">How do LLMs work?</text>
  <rect class="cursor1 fade" y="87" width="9" height="20" fill="#eee8d5"/>

  <!-- line 2: assistant 1 response, grows word by word, no cursor -->
  <text x="600" y="135" font-family="'Courier New', monospace" font-size="18" fill="#2aa198">
    <tspan class="wr1a fade">They</tspan>
    <tspan class="wr2a fade"> predict</tspan>
    <tspan class="wr3a fade"> the</tspan>
    <tspan class="wr4a fade"> next</tspan>
    <tspan class="wr5a fade"> token.</tspan>
  </text>

  <!-- line 3: typed question 2, with tracking cursor -->
  <text class="prompt2 fade" x="600" y="170" font-family="'Courier New', monospace" font-size="18" fill="#859900">&gt;</text>
  <text x="622" y="170" font-family="'Courier New', monospace" font-size="18" fill="#eee8d5" clip-path="url(#type2clip)">What about hallucinations?</text>
  <rect class="cursor2 fade" y="152" width="9" height="20" fill="#eee8d5"/>

  <!-- line 4: assistant 2 response, whole phrase, shared with left reveal timing -->
  <text class="answer2a fade" x="600" y="200" font-family="'Courier New', monospace" font-size="18" fill="#2aa198">They can still be wrong.</text>

  <!-- per-cycle flow indicators -->
  <g id="flow-pulses">
    <rect class="pg1 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg2 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg3 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg4 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pg5 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="pgR2 fade" x="20" y="48" width="520" height="232" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>

    <rect class="lg1 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg2 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg3 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg4 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lg5 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>
    <rect class="lgR2 fade" x="210" y="330" width="140" height="90" rx="10" fill="none" stroke="#eee8d5" stroke-width="4" filter="url(#softGlow)"/>

    <circle class="a1a1 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b1 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c1 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1a2 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b2 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c2 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1a3 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b3 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c3 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1a4 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b4 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c4 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1a5 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1b5 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1c5 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>
    <circle class="a1aR2 fade" cx="280" cy="290" r="7" fill="#eee8d5"/>
    <circle class="a1bR2 fade" cx="280" cy="305" r="7" fill="#eee8d5"/>
    <circle class="a1cR2 fade" cx="280" cy="320" r="7" fill="#eee8d5"/>

    <circle class="a2a1 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b1 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c1 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2a2 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b2 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c2 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2a3 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b3 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c3 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2a4 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b4 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c4 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2a5 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2b5 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2c5 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
    <circle class="a2aR2 fade" cx="280" cy="435" r="7" fill="#eee8d5"/>
    <circle class="a2bR2 fade" cx="280" cy="450" r="7" fill="#eee8d5"/>
    <circle class="a2cR2 fade" cx="280" cy="465" r="7" fill="#eee8d5"/>
  </g>
</svg>
