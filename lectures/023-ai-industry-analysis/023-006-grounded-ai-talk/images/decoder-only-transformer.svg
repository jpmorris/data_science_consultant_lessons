<svg width="849" height="1000" viewBox="0 0 900 1060" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a1a1"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b58900"/>
    </marker>
    <marker id="arrowCream" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eee8d5"/>
    </marker>
  </defs>

  <!-- input tokens -->
  <rect x="332" y="990" width="16" height="16" fill="#2aa198"/>
  <rect x="356" y="990" width="16" height="16" fill="#93a1a1"/>
  <rect x="380" y="990" width="16" height="16" fill="#93a1a1"/>
  <rect x="404" y="990" width="16" height="16" fill="#2aa198"/>
  <rect x="428" y="990" width="16" height="16" fill="#93a1a1"/>
  <text x="400" y="1032" text-anchor="middle" font-size="15" fill="#93a1a1">prompt tokens</text>
  <line x1="400" y1="988" x2="400" y2="960" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- embedding + positional -->
  <rect x="250" y="892" width="300" height="66" rx="8" fill="#0d4a55" stroke="#268bd2" stroke-width="2"/>
  <text x="400" y="918" text-anchor="middle" font-size="17" fill="#eee8d5">Token Embedding +</text>
  <text x="400" y="941" text-anchor="middle" font-size="17" fill="#eee8d5">Positional Encoding</text>
  <line x1="400" y1="890" x2="400" y2="856" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- transformer block boundary -->
  <rect x="170" y="288" width="460" height="562" rx="14" fill="none" stroke="#93a1a1" stroke-width="2" stroke-dasharray="8,6"/>
  <text x="192" y="306" font-size="16" fill="#b58900" font-weight="bold">Transformer Block <tspan font-size="13" font-weight="normal" fill="#93a1a1">(&#215; N, stacked)</tspan></text>

  <!-- branch point 1 (into norm1 / bypass) -->
  <circle cx="400" cy="850" r="4" fill="#eee8d5"/>
  <line x1="400" y1="846" x2="400" y2="832" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- norm 1 -->
  <rect x="310" y="782" width="180" height="50" rx="8" fill="#0d4a55" stroke="#6c71c4" stroke-width="2"/>
  <text x="400" y="812" text-anchor="middle" font-size="17" fill="#eee8d5">Norm</text>
  <line x1="400" y1="780" x2="400" y2="762" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- masked multi-head self-attention -->
  <rect x="250" y="612" width="300" height="150" rx="8" fill="#0d4a55" stroke="#2aa198" stroke-width="2"/>
  <text x="400" y="638" text-anchor="middle" font-size="16" fill="#eee8d5">Masked Multi-Head</text>
  <text x="400" y="660" text-anchor="middle" font-size="16" fill="#eee8d5">Self-Attention</text>
  <rect x="309" y="670" width="16" height="65" fill="#2aa198" opacity="0.9"/>
  <rect x="365" y="670" width="16" height="65" fill="#2aa198" opacity="0.7"/>
  <rect x="420" y="670" width="16" height="65" fill="#2aa198" opacity="0.5"/>
  <rect x="475" y="670" width="16" height="65" fill="#2aa198" opacity="0.3"/>
  <text x="400" y="752" text-anchor="middle" font-size="13" fill="#93a1a1">attention heads (illustrative)</text>

  <!-- KV cache, connected to attention -->
  <rect x="590" y="632" width="185" height="110" rx="8" fill="#0d4a55" stroke="#b58900" stroke-width="2"/>
  <text x="682" y="658" text-anchor="middle" font-size="16" fill="#eee8d5">KV Cache</text>
  <text x="682" y="682" text-anchor="middle" font-size="13" fill="#93a1a1">cached keys/values</text>
  <text x="682" y="700" text-anchor="middle" font-size="13" fill="#93a1a1">from prior tokens</text>
  <line x1="550" y1="687" x2="588" y2="687" stroke="#b58900" stroke-width="2" marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/>

  <line x1="400" y1="612" x2="400" y2="600" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- residual add 1 -->
  <circle cx="400" cy="582" r="16" fill="#0d4a55" stroke="#eee8d5" stroke-width="2"/>
  <text x="400" y="588" text-anchor="middle" font-size="18" fill="#eee8d5">+</text>
  <path d="M400,850 L205,850 L205,582 L384,582" fill="none" stroke="#eee8d5" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowCream)"/>
  <text x="205" y="716" font-size="12" fill="#eee8d5" transform="rotate(-90 205 716)" text-anchor="middle">residual</text>

  <line x1="400" y1="566" x2="400" y2="550" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- norm 2 -->
  <rect x="310" y="497" width="180" height="50" rx="8" fill="#0d4a55" stroke="#6c71c4" stroke-width="2"/>
  <text x="400" y="527" text-anchor="middle" font-size="17" fill="#eee8d5">Norm</text>
  <line x1="400" y1="495" x2="400" y2="477" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- feed-forward -->
  <rect x="270" y="362" width="260" height="113" rx="8" fill="#0d4a55" stroke="#859900" stroke-width="2"/>
  <text x="400" y="392" text-anchor="middle" font-size="16" fill="#eee8d5">Feed-Forward Network</text>
  <text x="400" y="414" text-anchor="middle" font-size="13" fill="#93a1a1">expand &#8594; activate &#8594; project</text>
  <rect x="360" y="428" width="14" height="16" fill="#859900" opacity="0.6"/>
  <rect x="380" y="422" width="14" height="28" fill="#859900"/>
  <rect x="400" y="428" width="14" height="16" fill="#859900" opacity="0.6"/>

  <line x1="400" y1="362" x2="400" y2="348" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- residual add 2 -->
  <circle cx="400" cy="330" r="16" fill="#0d4a55" stroke="#eee8d5" stroke-width="2"/>
  <text x="400" y="336" text-anchor="middle" font-size="18" fill="#eee8d5">+</text>
  <path d="M400,566 L205,566 L205,330 L384,330" fill="none" stroke="#eee8d5" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrowCream)"/>
  <text x="205" y="448" font-size="12" fill="#eee8d5" transform="rotate(-90 205 448)" text-anchor="middle">residual</text>

  <!-- exit decoder block -->
  <line x1="400" y1="314" x2="400" y2="255" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- final norm -->
  <rect x="310" y="197" width="180" height="50" rx="8" fill="#0d4a55" stroke="#6c71c4" stroke-width="2"/>
  <text x="400" y="227" text-anchor="middle" font-size="17" fill="#eee8d5">Final Norm</text>
  <line x1="400" y1="195" x2="400" y2="177" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- linear + softmax -->
  <rect x="250" y="112" width="300" height="63" rx="8" fill="#0d4a55" stroke="#268bd2" stroke-width="2"/>
  <text x="400" y="150" text-anchor="middle" font-size="17" fill="#eee8d5">Linear &#8594; Softmax</text>
  <line x1="400" y1="110" x2="400" y2="97" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output probabilities -->
  <rect x="230" y="20" width="340" height="75" rx="8" fill="#0d4a55" stroke="#b58900" stroke-width="2"/>
  <text x="400" y="43" text-anchor="middle" font-size="17" fill="#eee8d5">Next-token probabilities</text>
  <rect x="322" y="70" width="12" height="12" fill="#93a1a1"/>
  <rect x="342" y="58" width="12" height="24" fill="#93a1a1"/>
  <rect x="362" y="38" width="12" height="44" fill="#b58900"/>
  <rect x="382" y="62" width="12" height="20" fill="#93a1a1"/>
  <rect x="402" y="72" width="12" height="10" fill="#93a1a1"/>
  <rect x="422" y="66" width="12" height="16" fill="#93a1a1"/>
</svg>
