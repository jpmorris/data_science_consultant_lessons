<svg width="1677" height="1004" viewBox="0 25 2230 1335" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a1a1"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b58900"/>
    </marker>

    <!-- bigger, callout-specific arrowheads (kept separate from the main diagram's markers above) -->
    <marker id="calloutArrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#b58900"/>
    </marker>
    <marker id="calloutArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#268bd2"/>
    </marker>
    <marker id="calloutArrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6c71c4"/>
    </marker>
    <marker id="calloutArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#859900"/>
    </marker>
    <marker id="calloutArrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2aa198"/>
    </marker>
    <marker id="calloutArrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#93a1a1"/>
    </marker>

    <!-- soft glow used behind the three "most important mechanism" highlight boxes -->
    <filter id="emphasisGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= MAIN DIAGRAM (unchanged internally, shifted right) ================= -->
  <g transform="translate(600,0)">
    <!-- output probabilities -->
    <rect x="249.88957" y="37.074272" width="340.22086" height="83.036156" rx="8.0051966" fill="#0d4a55" stroke="#b58900" stroke-width="1.77914"/>
    <text x="419.18835" y="57.667618" text-anchor="middle" font-size="19" fill="#eee8d5">Next-token probabilities</text>
    <rect x="342" y="99" width="12" height="13" fill="#93a1a1"/>
    <rect x="362" y="86" width="12" height="26" fill="#93a1a1"/>
    <rect x="382" y="68" width="12" height="44" fill="#b58900"/>
    <rect x="402" y="90" width="12" height="22" fill="#93a1a1"/>
    <rect x="422" y="101" width="12" height="11" fill="#93a1a1"/>
    <rect x="442" y="95" width="12" height="17" fill="#93a1a1"/>
    <line x1="420" y1="153.32001" x2="420" y2="125.32001" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- linear + softmax -->
    <rect x="270" y="155.98001" width="300" height="58" rx="8" fill="#0d4a55" stroke="#268bd2" stroke-width="2"/>
    <text x="420" y="190.98001" text-anchor="middle" font-size="19" fill="#eee8d5">Linear &#8594; Softmax</text>
    <line x1="420" y1="257.30002" x2="420" y2="219.30002" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- final norm -->
    <rect x="325" y="262.62003" width="190" height="45" rx="8" fill="#0d4a55" stroke="#6c71c4" stroke-width="2"/>
    <text x="420" y="291.62003" text-anchor="middle" font-size="19" fill="#eee8d5">Final Norm</text>
    <line x1="420" y1="335.94003" x2="420" y2="312.94003" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- continuation dots: Final Norm down into the faded echo -->
    <circle cx="420" cy="341.62003" r="2.2" fill="#93a1a1"/>
    <circle cx="420" cy="353.62003" r="2.2" fill="#93a1a1"/>
    <circle cx="420" cy="365.62003" r="2.2" fill="#93a1a1"/>
    <!-- faded echo of the next block in the stack -->
    <rect x="190" y="376" width="450" height="55" rx="14" fill="none" stroke="#93a1a1" stroke-width="2" stroke-dasharray="8,6" opacity="0.32"/>
    <text x="410.67197" y="409.49405" text-anchor="middle" font-size="17" font-weight="bold" fill="#b58900">Additional Transformer Stacked Blocks (N total)</text>
    <path stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)" d="M 420,502.86838 V 473.56"/>
    <!-- continuation dots: block boundary up into the faded echo -->
    <circle cx="420" cy="440" r="2.2" fill="#93a1a1"/>
    <circle cx="420" cy="452" r="2.2" fill="#93a1a1"/>
    <circle cx="420" cy="464" r="2.2" fill="#93a1a1"/>
    <!-- transformer block boundary -->
    <rect x="189.97449" y="508.8786" width="450.05103" height="621.14716" rx="14.001587" fill="none" stroke="#93a1a1" stroke-width="1.94923" stroke-dasharray="8, 6"/>
    <text x="200.8174" y="531.07825" font-size="20" fill="#b58900" font-weight="bold">Transformer Block</text>
    <!-- residual connections: solid, same color/style as the flow arrows;
         both swing right and are drawn before the KV Cache connector below
         so the KV Cache's amber line renders on top where they cross -->
    <path d="M 420,1105.5826 H 580 V 814 H 435" fill="none" stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-969.31995" y="593.29987" font-size="14" fill="#93a1a1" transform="rotate(-90)" text-anchor="middle">residual</text>
    <path d="M 419.96375,785.24093 H 580.0358 V 530.68419 H 434.9705" fill="none" stroke="#93a1a1" stroke-width="1.94963" marker-end="url(#arrow)"/>
    <text x="-665" y="593.29987" font-size="14" fill="#93a1a1" transform="rotate(-90)" text-anchor="middle">residual</text>
    <!-- residual add 2 -->
    <circle cx="420" cy="531" r="15" fill="#0d4a55" stroke="#93a1a1" stroke-width="2"/>
    <text x="420" y="537" text-anchor="middle" font-size="18" fill="#eee8d5">+</text>
    <path stroke="#93a1a1" stroke-width="2.00032" marker-end="url(#arrow)" d="M 420,575.45913 V 551.32"/>
    <!-- feed-forward -->
    <rect x="290" y="582" width="260" height="100" rx="8" fill="#0d4a55" stroke="#859900" stroke-width="2"/>
    <text x="420" y="608" text-anchor="middle" font-size="18" fill="#eee8d5">Feed-Forward Network</text>
    <text x="420" y="630" text-anchor="middle" font-size="15" fill="#93a1a1">expand &#8594; activate &#8594; project</text>
    <rect x="380" y="648" width="14" height="16" fill="#859900" opacity="0.6"/>
    <rect x="400" y="642" width="14" height="28" fill="#859900"/>
    <rect x="420" y="648" width="14" height="16" fill="#859900" opacity="0.6"/>
    <path stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)" d="M 420,712.60696 V 687.32"/>
    <!-- norm 2 -->
    <rect x="330" y="718" width="180" height="45" rx="8" fill="#0d4a55" stroke="#6c71c4" stroke-width="2"/>
    <text x="420" y="747" text-anchor="middle" font-size="19" fill="#eee8d5">Norm</text>
    <path stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)" d="M 420,792.84174 V 768.32"/>
    <!-- residual add 1 -->
    <circle cx="420" cy="814" r="15" fill="#0d4a55" stroke="#93a1a1" stroke-width="2"/>
    <text x="420" y="820" text-anchor="middle" font-size="18" fill="#eee8d5">+</text>
    <path stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)" d="M 420,862.28522 V 834.32"/>
    <!-- masked multi-head self-attention -->
    <rect x="275" y="865" width="290" height="140" rx="8" fill="#0d4a55" stroke="#2aa198" stroke-width="2"/>
    <text x="420" y="891" text-anchor="middle" font-size="18" fill="#eee8d5">Masked Multi-Head</text>
    <text x="420" y="913" text-anchor="middle" font-size="18" fill="#eee8d5">Self-Attention</text>
    <rect x="310" y="924.68005" width="16" height="60" fill="#2aa198" opacity="0.9"/>
    <rect x="378" y="924.68005" width="16" height="60" fill="#2aa198" opacity="0.7"/>
    <rect x="446" y="924.68005" width="16" height="60" fill="#2aa198" opacity="0.5"/>
    <rect x="514" y="924.68005" width="16" height="60" fill="#2aa198" opacity="0.3"/>
    <text x="420" y="1000.34" text-anchor="middle" font-size="15" fill="#93a1a1">attention heads (illustrative)</text>
    <!-- KV cache, outside the block boundary -->
    <line x1="565" y1="935" x2="668" y2="935" stroke="#b58900" stroke-width="2" marker-start="url(#arrowAmber)" marker-end="url(#arrowAmber)"/>
    <rect x="670" y="885" width="175" height="100" rx="8" fill="#0d4a55" stroke="#b58900" stroke-width="2"/>
    <text x="757" y="911" text-anchor="middle" font-size="18" fill="#eee8d5">KV Cache</text>
    <text x="757" y="933" text-anchor="middle" font-size="14" fill="#93a1a1">cached keys/values</text>
    <text x="757" y="951" text-anchor="middle" font-size="14" fill="#93a1a1">from prior tokens</text>
    <path stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)" d="M 420,1035.9713 V 1010.32"/>
    <!-- norm 1 -->
    <rect x="330" y="1041" width="180" height="45" rx="8" fill="#0d4a55" stroke="#6c71c4" stroke-width="2"/>
    <text x="420" y="1070" text-anchor="middle" font-size="19" fill="#eee8d5">Norm</text>
    <path stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)" d="M 420,1109.9452 V 1091.32"/>
    <!-- branch point (into norm1 / residual bypass) -->
    <circle cx="420" cy="1114" r="4" fill="#eee8d5"/>
    <path stroke="#93a1a1" stroke-width="2" marker-end="url(#arrow)" d="M 420,1163.4591 V 1123.32"/>
    <!-- embedding + positional -->
    <rect x="270" y="1170" width="300" height="60" rx="8" fill="#0d4a55" stroke="#268bd2" stroke-width="2"/>
    <text x="420" y="1194" text-anchor="middle" font-size="19" fill="#eee8d5">Token Embedding +</text>
    <text x="420" y="1217" text-anchor="middle" font-size="19" fill="#eee8d5">Positional Encoding</text>
    <path stroke="#93a1a1" stroke-width="2.00032" marker-end="url(#arrow)" d="m 420.38261,1262.1556 v -23.7565"/>
    <!-- input tokens -->
    <rect x="372" y="1266" width="16" height="16" fill="#2aa198"/>
    <rect x="392" y="1266" width="16" height="16" fill="#93a1a1"/>
    <rect x="412" y="1266" width="16" height="16" fill="#93a1a1"/>
    <rect x="432" y="1266" width="16" height="16" fill="#2aa198"/>
    <rect x="452" y="1266" width="16" height="16" fill="#93a1a1"/>
    <text x="420" y="1308" text-anchor="middle" font-size="17" fill="#93a1a1">prompt tokens</text>
  </g>
  <!-- ================= CALLOUTS (reveal.js fragments, fade in and stay) ================= -->

  <!-- 9: next-token probabilities -->
  <g class="fragment" data-fragment-index="8" font-family="'Architects Daughter', cursive">
    <text x="20" y="75" font-size="30" fill="#eee8d5">The model's guess for</text>
    <text x="20" y="113" font-size="30" fill="#eee8d5">what comes next</text>
    <text x="20" y="163" font-size="26" fill="#b58900">&#8594; predicted:</text>
    <rect x="195" y="138" width="75" height="42" rx="7" fill="#0d4a55" stroke="#b58900" stroke-width="2"/>
    <text x="232.5" y="167" font-size="24" fill="#eee8d5" text-anchor="middle">king</text>
  </g>
  <path class="fragment" data-fragment-index="8" d="M360.0,80.0 L439.2,77.0 L527.2,83.0 L615.2,77.5 L703.2,82.0 L800.0,80.0" fill="none" stroke="#b58900" stroke-width="2" marker-end="url(#calloutArrowAmber)"/>

  <!-- 8: linear -> softmax -->
  <g class="fragment" data-fragment-index="7" font-family="'Architects Daughter', cursive">
    <text x="1450" y="180" font-size="30" fill="#eee8d5">Turns the final vector into</text>
    <text x="1450" y="218" font-size="30" fill="#eee8d5">token probabilities</text>
    <text x="1450" y="254" font-size="26" fill="#93a1a1">[0.01, 0.02, <tspan font-weight="bold" fill="#268bd2">0.89</tspan>, 0.01, 0.01, &#8230;]</text>
  </g>
  <path class="fragment" data-fragment-index="7" d="M1420.0,185.0 L1384.0,182.0 L1344.0,188.0 L1304.0,182.5 L1264.0,187.0 L1220.0,185.0" fill="none" stroke="#268bd2" stroke-width="2" marker-end="url(#calloutArrowBlue)"/>

  <!-- 7: x N fade box -->
  <g class="fragment" data-fragment-index="6" font-family="'Architects Daughter', cursive">
    <text x="20" y="398" font-size="30" fill="#eee8d5">Repeats N times, each pass</text>
    <text x="20" y="436" font-size="30" fill="#eee8d5">building on the last</text>
  </g>
  <path class="fragment" data-fragment-index="6" d="M430.0,408.0 L491.4,405.0 L559.7,411.0 L627.9,405.5 L696.1,410.0 L771.2,408.0" fill="none" stroke="#93a1a1" stroke-width="2" marker-end="url(#calloutArrowGrey)"/>

  <!-- 6: feed-forward network -->
  <g class="fragment" data-fragment-index="5" font-family="'Architects Daughter', cursive">
    <text x="20" y="615" font-size="30" fill="#eee8d5">Processes each token individually &#8212;</text>
    <text x="20" y="653" font-size="30" fill="#eee8d5">this is largely where facts about</text>
    <text x="20" y="691" font-size="30" fill="#eee8d5">the world are stored</text>
  </g>
  <path class="fragment" data-fragment-index="5" d="M530.0,632.0 L589.0,629.0 L654.6,635.0 L720.2,629.5 L785.8,634.0 L858.0,632.0" fill="none" stroke="#859900" stroke-width="2" marker-end="url(#calloutArrowGreen)"/>
  <rect class="fragment emphasis-highlight" data-fragment-index="5" x="882" y="574" width="276" height="116" rx="16" fill="none" stroke="#859900" filter="url(#emphasisGlow)"/>

  <!-- 5: masked multi-head self-attention -->
  <g class="fragment" data-fragment-index="3" font-family="'Architects Daughter', cursive">
    <text x="20" y="918" font-size="30" fill="#eee8d5">Gathers context from earlier</text>
    <text x="20" y="956" font-size="30" fill="#eee8d5">tokens, several ways at once</text>
  </g>
  <path class="fragment" data-fragment-index="3" d="M460.0,933.0 L529.6,930.0 L607.0,936.0 L684.4,930.5 L761.8,935.0 L846.9,933.0" fill="none" stroke="#2aa198" stroke-width="2" marker-end="url(#calloutArrowCyan)"/>
  <rect class="fragment emphasis-highlight" data-fragment-index="3" x="867" y="857" width="306" height="156" rx="16" fill="none" stroke="#2aa198" filter="url(#emphasisGlow)"/>

  <!-- 4: KV cache: callout on the RIGHT, since KV Cache is itself the one
       component living outside the main column; a short direct arrow beats
       a long detour around the attention box -->
  <g class="fragment" data-fragment-index="4" font-family="'Architects Daughter', cursive">
    <text x="1740" y="918" font-size="30" fill="#eee8d5">Stores past keys/values</text>
    <text x="1740" y="956" font-size="30" fill="#eee8d5">so they're not recomputed</text>
  </g>
  <path class="fragment" data-fragment-index="4" d="M1715.0,933.0 L1675.4,930.0 L1631.4,936.0 L1587.4,930.5 L1543.4,935.0 L1495.0,933.0" fill="none" stroke="#b58900" stroke-width="2" marker-end="url(#calloutArrowAmber)"/>
  <rect class="fragment emphasis-highlight" data-fragment-index="4" x="1262" y="877" width="191" height="116" rx="16" fill="none" stroke="#b58900" filter="url(#emphasisGlow)"/>

  <!-- 3: first norm -->
  <g class="fragment" data-fragment-index="2" font-family="'Architects Daughter', cursive">
    <text x="20" y="1048" font-size="30" fill="#eee8d5">Keeps values in a</text>
    <text x="20" y="1086" font-size="30" fill="#eee8d5">stable range</text>
  </g>
  <path class="fragment" data-fragment-index="2" d="M280.0,1063.0 L392.4,1060.0 L517.2,1066.0 L642.0,1060.5 L766.9,1065.0 L904.2,1063.0" fill="none" stroke="#6c71c4" stroke-width="2" marker-end="url(#calloutArrowViolet)"/>

  <!-- 2: token + positional embedding -->
  <g class="fragment" data-fragment-index="1" font-family="'Architects Daughter', cursive">
    <text x="1550" y="1165" font-size="30" fill="#eee8d5">Each token becomes a</text>
    <text x="1550" y="1201" font-size="30" fill="#eee8d5">vector of numbers, e.g.</text>
    <text x="1550" y="1231" font-size="26" fill="#93a1a1">"coron" &#8594; [0.12, 0.88, 0.41, &#8230;]</text>
  </g>
  <path class="fragment" data-fragment-index="1" d="M1520.0,1200.0 L1466.0,1197.0 L1406.0,1203.0 L1346.0,1197.5 L1286.0,1202.0 L1220.0,1200.0" fill="none" stroke="#268bd2" stroke-width="2" marker-end="url(#calloutArrowBlue)"/>

  <!-- 1: prompt tokens -->
  <g class="fragment" data-fragment-index="0" font-family="'Architects Daughter', cursive">
    <text x="20" y="1258" font-size="30" fill="#eee8d5">Split into tokens &#8212;</text>
    <text x="20" y="1296" font-size="30" fill="#eee8d5">not always whole words:</text>
    <g font-size="24" fill="#eee8d5" text-anchor="middle">
      <rect x="20" y="1310" width="57" height="42" rx="7" fill="#0d4a55" stroke="#93a1a1"/>
      <text x="48.5" y="1339">The</text>
      <rect x="89" y="1310" width="81" height="42" rx="7" fill="#0d4a55" stroke="#93a1a1"/>
      <text x="129.5" y="1339">coron</text>
      <rect x="182" y="1310" width="81" height="42" rx="7" fill="#0d4a55" stroke="#93a1a1"/>
      <text x="222.5" y="1339">ation</text>
      <rect x="275" y="1310" width="69" height="42" rx="7" fill="#0d4a55" stroke="#93a1a1"/>
      <text x="309.5" y="1339">made</text>
      <rect x="356" y="1310" width="57" height="42" rx="7" fill="#0d4a55" stroke="#93a1a1"/>
      <text x="384.5" y="1339">him</text>
    </g>
  </g>
  <path class="fragment" data-fragment-index="0" d="M400.0,1274.0 L494.0,1271.0 L598.4,1277.0 L702.8,1271.5 L807.2,1276.0 L922.0,1274.0" fill="none" stroke="#93a1a1" stroke-width="2" marker-end="url(#calloutArrowGrey)"/>

</svg>
