  </defs>

  <text x="650" y="34" text-anchor="middle" font-size="30" font-weight="600" fill="#eee8d5">AI Task-Completion Time Horizon</text>
  <text x="650" y="57" text-anchor="middle" font-size="16" fill="#93a1a1">26 real measurements, a fitted trend, and illustrative futures out to 2030 &mdash; log scale</text>

