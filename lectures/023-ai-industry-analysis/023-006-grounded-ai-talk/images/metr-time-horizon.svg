<svg width="1300" height="830" viewBox="0 0 1300 830">
  <defs>
    <pattern id="unreliable-hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#586e75" stroke-width="2" opacity="0.5"/>
