  <!-- AI 2027 milestone definitions -- two columns so each agent is clearly its own line -->
  <rect x="150" y="655" width="1100" height="130" rx="8" fill="#215862" fill-opacity="0.5" stroke="#586e75" stroke-width="1" stroke-opacity="0.5"/>
  <text x="170" y="680" font-size="16" font-weight="600" fill="#b58900">AI 2027's Agent-0 through Agent-4 (per ai-2027.com):</text>
  <text x="170" y="708" font-size="15" fill="#eee8d5">Agent-0 (~late 2025): first heavily AI-assisted in-house model</text>
  <text x="170" y="732" font-size="15" fill="#eee8d5">Agent-1 (~early 2026): near top-human research engineer</text>
  <text x="170" y="756" font-size="15" fill="#eee8d5">Agent-2 (Jan 2027): near-best-human at autonomous cyber-offense</text>
  <text x="720" y="708" font-size="15" fill="#eee8d5">Agent-3 (Mar 2027): fast, cheap superhuman coder</text>
  <text x="720" y="732" font-size="15" fill="#eee8d5">Agent-4 (Sep 2027): better at AI research than any human</text>

  <text x="650" y="805" text-anchor="middle" font-size="14" fill="#586e75">Log scale &mdash; METR Time Horizon 1.1 (Jan 2026, live data); AI 2027 milestones are illustrative, ai-2027.com (not a published data table)</text>
