  <!-- Mechanism callouts, hand-drawn/xkcd style (wavy multi-point paths,
       oversized arrowheads) to match the callout convention used on other
       diagrams in this deck (see images/decoder-only-transformer.svg).
       Pretraining, fine-tuning, and RLHF/RLVR all converge on the glowing
       Transformer Block -- they're the same mechanism (gradient descent
       on the same weights), just different data/objective. Inference-time
       gets a loop instead of a straight callout: it doesn't skip anything
       inside the block -- it re-runs the WHOLE stack (this block included)
       once per extra generated token, which is what "thinking longer"
       actually is (Brown/Snell's repeated-sampling and longer-chain-of-
       thought framing, same citations as the Inference-Time card above). -->
  <text x="-15" y="295" text-anchor="end" font-size="21" font-weight="700" fill="#2aa198">Pretraining</text>
  <path d="M -10,300 L 55,297 L 130,304 L 190,297 L 250,300" fill="none" stroke="#2aa198" stroke-width="2.5" marker-end="url(#mech-arrow-teal)"/>

  <text x="-15" y="360" text-anchor="end" font-size="21" font-weight="700" fill="#268bd2">Fine-tuning</text>
  <path d="M -10,365 L 55,362 L 130,369 L 190,362 L 250,365" fill="none" stroke="#268bd2" stroke-width="2.5" marker-end="url(#mech-arrow-blue)"/>

  <text x="-15" y="429" text-anchor="end" font-size="21" font-weight="700" fill="#d33682">RLHF / RLVR</text>
  <path d="M -10,433 L 60,421 L 130,428 L 190,417 L 250,412" fill="none" stroke="#d33682" stroke-width="2.5" marker-end="url(#mech-arrow-magenta)"/>

  <text x="655" y="150" text-anchor="start" font-size="21" font-weight="700" fill="#cb4b16">Inference-time</text>
  <text x="655" y="330" text-anchor="start" font-size="26" font-weight="700" fill="#cb4b16">&times;N</text>
