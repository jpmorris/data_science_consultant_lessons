<svg width="950" height="620" viewBox="0 0 950 620">
  <defs>
    <radialGradient id="hazeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b58900" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#b58900" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#b58900" stop-opacity="0"/>
    </radialGradient>
    <filter id="hazeBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="holeBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- fully soft, no sharp core -- for the example points, so they read as
         emerging from the haze rather than floating in front of it -->
    <filter id="dotSoftGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- the haze: several overlapping blurred ellipses sharing one gradient -->
  <g filter="url(#hazeBlur)">
    <ellipse cx="272" cy="275" rx="253" ry="190" fill="url(#hazeGradient)"/>
    <ellipse cx="433" cy="178" rx="207" ry="161" fill="url(#hazeGradient)"/>
    <ellipse cx="462" cy="390" rx="236" ry="201" fill="url(#hazeGradient)"/>
    <ellipse cx="232" cy="436" rx="201" ry="161" fill="url(#hazeGradient)"/>
    <ellipse cx="590" cy="290" rx="150" ry="128" fill="url(#hazeGradient)"/>
  </g>

  <!-- interpolation: a hole -- a discovery already sitting in the known
       region, just missed. Dashed outline and heading use the interpolation
       key color so it reads against the legend. -->
  <circle cx="255" cy="235" r="24" fill="#0d4a55" filter="url(#holeBlur)"/>
  <circle cx="255" cy="235" r="24" fill="none" stroke="#268bd2" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
  <text x="255" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#268bd2">A hole: already known, just missed</text>
  <text x="255" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#93a1a1">
    <tspan x="255" dy="0">DeepMind, Jan 2026 — a systematic re-check</tspan>
    <tspan x="255" dy="20">surfaced 9 old Erdős problems that were</tspan>
    <tspan x="255" dy="20">already solved, just never indexed</tspan>
  </text>

  <!-- two more holes, deliberately unannotated -->
  <circle cx="470" cy="230" r="19" fill="#0d4a55" filter="url(#holeBlur)"/>
  <circle cx="340" cy="470" r="16" fill="#0d4a55" filter="url(#holeBlur)"/>

  <!-- paradigm-shift example: now sitting INSIDE the known cloud, since
       special relativity has long since been absorbed into known human
       knowledge. There's deliberately nothing placed beyond the cloud's
       edge -- a real example of that would be, by definition, something
       nobody has found yet. -->
  <circle cx="160" cy="530" r="15" fill="#6c71c4" filter="url(#dotSoftGlow)"/>
  <text x="160" y="430" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#6c71c4">Einstein — Special Relativity (1905)</text>
  <text x="160" y="453" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#93a1a1">
    <tspan x="160" dy="0">Long since folded into known knowledge —</tspan>
    <tspan x="160" dy="20">a genuine paradigm shift when it arrived.</tspan>
    <tspan x="160" dy="20">AI hasn't produced anything at this level yet.</tspan>
  </text>

  <!-- frontier-edge point 1: harness-based, clean win -- pulled in toward
       the haze so it reads as emerging from it, not floating outside -->
  <circle cx="592" cy="165" r="14" fill="#b58900" filter="url(#dotSoftGlow)"/>
  <text x="628" y="140" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#b58900">AlphaEvolve (2025) — harness-based</text>
  <text x="628" y="163" font-family="Inter, sans-serif" font-size="14" fill="#93a1a1">
    <tspan x="628" dy="0">Evolutionary code search + an automatic</tspan>
    <tspan x="628" dy="20">verifier found a 4×4 matrix-multiplication</tspan>
    <tspan x="628" dy="20">algorithm beating a 56-year-old bound</tspan>
  </text>

  <!-- frontier-edge point 2: the contested OpenAI claim -->
  <circle cx="583" cy="480" r="14" fill="#b58900" filter="url(#dotSoftGlow)"/>
  <text x="620" y="460" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#b58900">OpenAI's Erdős disproof (2026)</text>
  <text x="620" y="483" font-family="Inter, sans-serif" font-size="14" fill="#93a1a1">
    <tspan x="620" dy="0">Marketed as one model's breakthrough —</tspan>
    <tspan x="620" dy="20">but independent reporting classifies the</tspan>
    <tspan x="620" dy="20">actual process as harness-based too</tspan>
  </text>
</svg>
