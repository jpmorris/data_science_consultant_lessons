<svg width="1150" height="595" viewBox="0 0 1200 620">
  <defs>
    <radialGradient id="hazeGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b58900" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#b58900" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#b58900" stop-opacity="0"/>
    </radialGradient>
    <filter id="hazeBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="holeBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- fully soft, no sharp core -- for the edge points, so they read as
         emerging from the haze rather than floating in front of it -->
    <filter id="dotSoftGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- region labels -->
  <text x="70" y="46" font-family="Inter, sans-serif" font-size="19" font-style="italic" fill="#93a1a1">KNOWN — interpolation &amp; recombination</text>
  <text x="760" y="46" font-family="Inter, sans-serif" font-size="19" font-style="italic" fill="#93a1a1">UNKNOWN — needs a paradigm shift</text>

  <!-- the haze: several overlapping blurred ellipses sharing one gradient -->
  <g filter="url(#hazeBlur)">
    <ellipse cx="272" cy="275" rx="253" ry="190" fill="url(#hazeGradient)"/>
    <ellipse cx="433" cy="178" rx="207" ry="161" fill="url(#hazeGradient)"/>
    <ellipse cx="462" cy="390" rx="236" ry="201" fill="url(#hazeGradient)"/>
    <ellipse cx="232" cy="436" rx="201" ry="161" fill="url(#hazeGradient)"/>
    <ellipse cx="590" cy="290" rx="150" ry="128" fill="url(#hazeGradient)"/>
  </g>

  <!-- a hole: a discovery that was already sitting in the known region, just missed -->
  <circle cx="255" cy="235" r="24" fill="#0d4a55" filter="url(#holeBlur)"/>
  <circle cx="255" cy="235" r="24" fill="none" stroke="#eee8d5" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="255" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#eee8d5">A hole: already known, just missed</text>
  <text x="255" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#93a1a1">
    <tspan x="255" dy="0">DeepMind, Jan 2026 — a systematic re-check</tspan>
    <tspan x="255" dy="20">surfaced 9 old Erdős problems that were</tspan>
    <tspan x="255" dy="20">already solved, just never indexed</tspan>
  </text>

  <!-- two more holes, deliberately unannotated -->
  <circle cx="470" cy="230" r="19" fill="#0d4a55" filter="url(#holeBlur)"/>
  <circle cx="340" cy="470" r="16" fill="#0d4a55" filter="url(#holeBlur)"/>

  <!-- names the cloud itself -->
  <text x="330" y="558" text-anchor="middle" font-family="Inter, sans-serif" font-size="23" font-weight="700" fill="#eee8d5">Known Human Knowledge</text>

  <!-- edge point 1: harness-based, clean win -- pulled in toward the haze
       and fully soft, so it reads as emerging from it, not floating outside -->
  <circle cx="592" cy="165" r="14" fill="#859900" filter="url(#dotSoftGlow)"/>
  <text x="628" y="140" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#859900">AlphaEvolve (2025) — harness-based</text>
  <text x="628" y="163" font-family="Inter, sans-serif" font-size="14" fill="#93a1a1">
    <tspan x="628" dy="0">Evolutionary code search + an automatic</tspan>
    <tspan x="628" dy="20">verifier found a 4×4 matrix-multiplication</tspan>
    <tspan x="628" dy="20">algorithm beating a 56-year-old bound</tspan>
  </text>

  <!-- edge point 2: the contested OpenAI claim -->
  <circle cx="583" cy="480" r="14" fill="#b58900" filter="url(#dotSoftGlow)"/>
  <text x="620" y="460" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#b58900">OpenAI's Erdős disproof (2026)*</text>
  <text x="620" y="483" font-family="Inter, sans-serif" font-size="14" fill="#93a1a1">
    <tspan x="620" dy="0">Marketed as one model's breakthrough —</tspan>
    <tspan x="620" dy="20">but independent reporting classifies the</tspan>
    <tspan x="620" dy="20">actual process as harness-based too</tspan>
  </text>
  <text x="620" y="545" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#657b7b">*see notes / discoveries table — not the clean non-harness case it's marketed as</text>

  <!-- beyond the haze entirely -->
  <circle cx="985" cy="320" r="11" fill="#6c71c4" filter="url(#dotGlow)"/>
  <text x="985" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#6c71c4">Einstein — Special Relativity (1905)</text>
  <text x="985" y="352" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#93a1a1">
    <tspan x="985" dy="0">A genuine paradigm shift, not a</tspan>
    <tspan x="985" dy="20">recombination of existing physics.</tspan>
    <tspan x="985" dy="20">No AI system has produced anything</tspan>
    <tspan x="985" dy="20">like this yet.</tspan>
  </text>
</svg>
