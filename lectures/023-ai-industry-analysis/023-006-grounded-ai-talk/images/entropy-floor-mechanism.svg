<svg width="1900" height="600" viewBox="0 0 1900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="floorMechArrowStructPlain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93a1a1"/>
    </marker>
    <marker id="floorMechArrowBluePlain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#268bd2"/>
    </marker>
    <marker id="floorMechArrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#268bd2"/>
    </marker>
    <marker id="floorMechArrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#cb4b16"/>
    </marker>
    <marker id="floorMechArrowPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#d33682"/>
    </marker>
    <marker id="floorMechArrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#6c71c4"/>
    </marker>
    <marker id="floorMechArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#859900"/>
    </marker>
    <marker id="floorMechArrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#b58900"/>
    </marker>
    <marker id="floorMechArrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#2aa198"/>
    </marker>
    <marker id="floorMechArrowGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#93a1a1"/>
    </marker>
  </defs>

  <!-- prompt tokens, feeding in from the left -->
  <rect x="400" y="292" width="18" height="18" fill="#2aa198"/>
  <rect x="422" y="292" width="18" height="18" fill="#93a1a1"/>
  <rect x="444" y="292" width="18" height="18" fill="#2aa198"/>
  <rect x="466" y="292" width="18" height="18" fill="#93a1a1"/>
  <text x="443" y="345" text-anchor="middle" font-size="18" fill="#93a1a1">prompt</text>

  <!-- the LLM itself: the exact same shaded, unlabeled-sketch silhouette used
       for the boxed LLM on "The Ingredients of an LLM" (same coordinates as
       the xfmrBoxEls group in llm-axes-anim.html), just rotated 90 degrees so
       it reads left-to-right instead of bottom-to-top, then scaled up and
       positioned -- nothing about the sketch itself is resized or redrawn,
       only rotated, scaled, and moved as one group. -->
  <g transform="translate(359,-180.5) scale(1.5)">
  <g transform="rotate(90,350,321)">
    <!-- main input arrow (was the bottom "king" arrow) -->
    <line x1="352" y1="562" x2="352" y2="530" stroke="#268bd2" stroke-width="3" marker-end="url(#floorMechArrowBluePlain)"/>
    <!-- outer frame -->
    <rect x="246" y="105" width="208" height="432" rx="10" fill="#93a1a1" fill-opacity="0" stroke="#93a1a1" stroke-opacity="0.7" stroke-width="2"/>
    <!-- output box -->
    <rect x="260" y="116" width="180" height="35" rx="8" fill="#93a1a1" fill-opacity="0.1" stroke="#93a1a1" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- output arrow -->
    <line x1="350" y1="93" x2="350" y2="45" stroke="#93a1a1" stroke-width="2" marker-end="url(#floorMechArrowStructPlain)"/>
    <!-- linear + softmax -->
    <rect x="280" y="159" width="140" height="28" rx="6" fill="#93a1a1" fill-opacity="0.1" stroke="#93a1a1" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- final norm -->
    <rect x="305" y="197" width="90" height="18" rx="4" fill="#93a1a1" fill-opacity="0.1" stroke="#93a1a1" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- repeat connector 1 -->
    <line x1="350" y1="223" x2="350" y2="215" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="1.5,5" marker-end="url(#floorMechArrowStructPlain)"/>
    <!-- repeated-N-times box -->
    <rect x="280" y="223" width="140" height="20" rx="4" fill="#93a1a1" fill-opacity="0" stroke="#93a1a1" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="6,5"/>
    <!-- repeat connector 2 -->
    <line x1="350" y1="251" x2="350" y2="243" stroke="#93a1a1" stroke-width="1.5" stroke-dasharray="1.5,5" marker-end="url(#floorMechArrowStructPlain)"/>
    <!-- transformer block outer -->
    <rect x="258" y="251" width="184" height="229" rx="10" fill="#93a1a1" fill-opacity="0" stroke="#93a1a1" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6,5"/>
    <!-- residual add 2 -->
    <line x1="343" y1="262" x2="357" y2="262" stroke="#93a1a1" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="350" y1="255" x2="350" y2="269" stroke="#93a1a1" stroke-opacity="0.6" stroke-width="2"/>
    <!-- feed-forward mini-network -->
    <rect x="275" y="270" width="150" height="58" rx="6" fill="#93a1a1" fill-opacity="0.1" stroke="#93a1a1" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- norm 2 -->
    <rect x="305" y="336" width="90" height="18" rx="4" fill="#93a1a1" fill-opacity="0.1" stroke="#93a1a1" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- residual add 1 -->
    <line x1="343" y1="362" x2="357" y2="362" stroke="#93a1a1" stroke-opacity="0.6" stroke-width="2"/>
    <line x1="350" y1="355" x2="350" y2="369" stroke="#93a1a1" stroke-opacity="0.6" stroke-width="2"/>
    <!-- masked multi-head self-attention mini-network -->
    <rect x="270" y="370" width="160" height="76" rx="6" fill="#93a1a1" fill-opacity="0.1" stroke="#93a1a1" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- norm 1 -->
    <rect x="305" y="454" width="90" height="18" rx="4" fill="#93a1a1" fill-opacity="0.1" stroke="#93a1a1" stroke-opacity="0.55" stroke-width="1.5"/>
    <!-- token embedding + positional encoding -->
    <rect x="285" y="492" width="130" height="30" rx="6" fill="#93a1a1" fill-opacity="0.1" stroke="#93a1a1" stroke-opacity="0.55" stroke-width="1.5"/>

    <!-- FFN (3-column, fully connected) and ATTN (three 2x2 head clusters)
         mini-networks -- same dot/line pattern as the real slide, just not
         re-colored per training stage since this diagram is static -->
    <g class="floor-mech-xfmr-mesh-lines" fill="none" stroke="#2aa198" stroke-opacity="0.85" stroke-width="1">
      <line x1="305" y1="288" x2="350" y2="278"/>
      <line x1="305" y1="288" x2="350" y2="299"/>
      <line x1="305" y1="288" x2="350" y2="320"/>
      <line x1="305" y1="310" x2="350" y2="278"/>
      <line x1="305" y1="310" x2="350" y2="299"/>
      <line x1="305" y1="310" x2="350" y2="320"/>
      <line x1="350" y1="278" x2="395" y2="288"/>
      <line x1="350" y1="278" x2="395" y2="310"/>
      <line x1="350" y1="299" x2="395" y2="288"/>
      <line x1="350" y1="299" x2="395" y2="310"/>
      <line x1="350" y1="320" x2="395" y2="288"/>
      <line x1="350" y1="320" x2="395" y2="310"/>
      <line x1="296" y1="392" x2="314" y2="392"/>
      <line x1="296" y1="392" x2="314" y2="424"/>
      <line x1="296" y1="424" x2="314" y2="392"/>
      <line x1="296" y1="424" x2="314" y2="424"/>
      <line x1="341" y1="392" x2="359" y2="392"/>
      <line x1="341" y1="392" x2="359" y2="424"/>
      <line x1="341" y1="424" x2="359" y2="392"/>
      <line x1="341" y1="424" x2="359" y2="424"/>
      <line x1="386" y1="392" x2="404" y2="392"/>
      <line x1="386" y1="392" x2="404" y2="424"/>
      <line x1="386" y1="424" x2="404" y2="392"/>
      <line x1="386" y1="424" x2="404" y2="424"/>
    </g>
    <g class="floor-mech-xfmr-mesh-dots" fill="#eee8d5">
      <circle cx="305" cy="288" r="3"/>
      <circle cx="305" cy="310" r="3"/>
      <circle cx="350" cy="278" r="3"/>
      <circle cx="350" cy="299" r="3"/>
      <circle cx="350" cy="320" r="3"/>
      <circle cx="395" cy="288" r="3"/>
      <circle cx="395" cy="310" r="3"/>
      <circle cx="296" cy="392" r="3"/>
      <circle cx="296" cy="424" r="3"/>
      <circle cx="314" cy="392" r="3"/>
      <circle cx="314" cy="424" r="3"/>
      <circle cx="341" cy="392" r="3"/>
      <circle cx="341" cy="424" r="3"/>
      <circle cx="359" cy="392" r="3"/>
      <circle cx="359" cy="424" r="3"/>
      <circle cx="386" cy="392" r="3"/>
      <circle cx="386" cy="424" r="3"/>
      <circle cx="404" cy="392" r="3"/>
      <circle cx="404" cy="424" r="3"/>
    </g>
  </g>
  </g>

  <!-- the harness, chained off the LLM's output -->
  <rect x="1340" y="216" width="360" height="170" rx="15" fill="#0d4a55" stroke="#859900" stroke-width="3"/>
  <text x="1520" y="310" text-anchor="middle" font-size="34" font-weight="700" fill="#eee8d5">Harness</text>

  <!-- callouts: eight ways to lower the floor, each pointing at the piece
       of the pipeline that lever actually acts on. Two per attachment point
       (weights, prompt) fan in from opposite sides; the harness, which
       collects four, gets one pair above and one pair below. -->
  <g font-family="'Architects Daughter', cursive">
    <!-- weights: training data (pink) + fine-tuning/RLHF (violet), both from above -->
    <text x="600" y="90" font-size="28" fill="#eee8d5">Better training data of reality</text>
    <path d="M860,108 C875,150 888,195 897,238" fill="none" stroke="#d33682" stroke-width="2.5" marker-end="url(#floorMechArrowPink)"/>

    <text x="1090" y="90" font-size="28" fill="#eee8d5">Fine-tuning / RLHF</text>
    <path d="M1120,108 C1080,150 1010,200 942,248" fill="none" stroke="#6c71c4" stroke-width="2.5" marker-end="url(#floorMechArrowViolet)"/>

    <!-- prompt: context/specs (blue, from below) + RAG/few-shot (orange, from above) -->
    <text x="300" y="165" font-size="28" fill="#eee8d5">RAG / Few-shot</text>
    <path d="M460,183 C475,215 465,255 452,286" fill="none" stroke="#cb4b16" stroke-width="2.5" marker-end="url(#floorMechArrowOrange)"/>

    <text x="340" y="475" font-size="28" fill="#eee8d5">Context, Requirements,</text>
    <text x="340" y="507" font-size="28" fill="#eee8d5">Specs</text>
    <path d="M480,462 C450,430 405,385 402,318" fill="none" stroke="#268bd2" stroke-width="2.5" marker-end="url(#floorMechArrowBlue)"/>

    <!-- harness: unit tests (green) + multi-agent critique (grey) from below,
         type checkers (amber) + verifier/oracle (teal) from above -->
    <text x="1345" y="150" font-size="26" fill="#eee8d5">Type checkers</text>
    <path d="M1420,168 C1420,182 1425,198 1432,214" fill="none" stroke="#b58900" stroke-width="2.5" marker-end="url(#floorMechArrowAmber)"/>

    <text x="1590" y="150" font-size="26" fill="#eee8d5">Verifier / Oracle</text>
    <path d="M1640,168 C1635,182 1625,198 1615,214" fill="none" stroke="#2aa198" stroke-width="2.5" marker-end="url(#floorMechArrowTeal)"/>

    <text x="1345" y="470" font-size="26" fill="#eee8d5">Unit tests</text>
    <path d="M1400,455 C1405,438 1412,410 1420,388" fill="none" stroke="#859900" stroke-width="2.5" marker-end="url(#floorMechArrowGreen)"/>

    <text x="1590" y="470" font-size="26" fill="#eee8d5">Multi-agent critique</text>
    <path d="M1650,455 C1645,438 1635,410 1622,388" fill="none" stroke="#93a1a1" stroke-width="2.5" marker-end="url(#floorMechArrowGrey)"/>
  </g>
</svg>
