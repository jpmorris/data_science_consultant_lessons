<svg width="760" height="600" viewBox="0 0 760 600">
  <defs>
    <filter id="dotSoftGlow2" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="regionBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- axes -->
  <line x1="110" y1="60" x2="110" y2="480" stroke="#93a1a1" stroke-width="2"/>
  <line x1="110" y1="480" x2="680" y2="480" stroke="#93a1a1" stroke-width="2"/>

  <!-- axis end labels -->
  <text x="110" y="502" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#93a1a1">One-shot</text>
  <text x="680" y="502" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#93a1a1">Many (harness / verifier)</text>
  <text x="100" y="475" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#93a1a1">Poor</text>
  <text x="100" y="70" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#93a1a1">Great</text>

  <!-- axis titles -->
  <text x="395" y="535" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" letter-spacing="0.03em" fill="#eee8d5">Number of Final Solution Attempts</text>
  <text x="-270" y="30" transform="rotate(-90)" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" letter-spacing="0.03em" fill="#eee8d5">Solving Ability (per attempt)</text>

  <!-- Human Expert region: squat oval, stays clear of the y-axis (no negative attempts),
       barely clips the top edge of Math (one-shot) rather than containing it -->
  <ellipse cx="260" cy="170" rx="140" ry="60" fill="#dc322f" opacity="0.22" filter="url(#regionBlur)"/>
  <ellipse cx="260" cy="170" rx="140" ry="60" fill="none" stroke="#dc322f" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="260" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#dc322f" opacity="0.9">Human Expert</text>

  <!-- Math (one-shot) -- just brushing the Human Expert region's lower edge -->
  <circle cx="190" cy="240" r="20" fill="#859900" filter="url(#dotSoftGlow2)"/>
  <text x="190" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#859900">Math</text>
  <text x="190" y="309" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#859900">(one-shot)</text>

  <!-- Math (Lean-harness) -- many attempts, nudged left a little; low per-attempt ability
       since it needs so many tries to land a verified answer -->
  <circle cx="510" cy="385" r="20" fill="#2aa198" filter="url(#dotSoftGlow2)"/>
  <text x="510" y="425" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#2aa198">Math</text>
  <text x="510" y="444" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#2aa198">(Lean-harness)</text>

  <!-- Physics -- lower now: beyond the one gluon-amplitude case, most 2026 AI-physics
       activity is augmentation or rediscovery, not one-shot theory -->
  <circle cx="440" cy="415" r="18" fill="#cb4b16" filter="url(#dotSoftGlow2)"/>
  <text x="440" y="378" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#cb4b16">Physics</text>

  <!-- Cybersecurity -- agentic, many-attempts, trying known intrusion patterns rather
       than reading source and spotting the flaw; below Math (one-shot), near Math (Lean) -->
  <circle cx="580" cy="345" r="19" fill="#d33682" filter="url(#dotSoftGlow2)"/>
  <text x="580" y="308" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#d33682">Cybersecurity</text>

  <!-- Computational Biology -- GeneBench-Pro: best model solves <1/3 of realistic research
       tasks even at max compute (far right = many attempts). Label sits above the dot
       to stay clear of the x-axis end label below it. -->
  <circle cx="630" cy="440" r="17" fill="#b58900" filter="url(#dotSoftGlow2)"/>
  <text x="630" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#b58900">Computational Biology</text>

  <text x="400" y="565" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#93a1a1" opacity="0.8">Computer Science dropped -- overlaps the Math bucket, not a distinct regime (see notes)</text>
</svg>
