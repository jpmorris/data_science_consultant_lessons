<svg width="760" height="615" viewBox="0 0 760 615">
  <defs>
    <filter id="dotSoftGlow2" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="regionBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <linearGradient id="exampleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5f9e6e"/>
      <stop offset="100%" stop-color="#dc322f"/>
    </linearGradient>
  </defs>

  <!-- axes -->
  <line x1="110" y1="120" x2="110" y2="540" stroke="#93a1a1" stroke-width="2"/>
  <line x1="110" y1="540" x2="680" y2="540" stroke="#93a1a1" stroke-width="2"/>

  <!-- axis end labels -->
  <text x="110" y="562" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#93a1a1">One-shot</text>
  <text x="680" y="562" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#93a1a1">Many (harness / verifier)</text>
  <text x="100" y="535" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#93a1a1">Poor</text>
  <text x="100" y="130" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#93a1a1">Great</text>

  <!-- axis titles -->
  <text x="395" y="595" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" letter-spacing="0.03em" fill="#eee8d5">Number of Final Solution Attempts</text>
  <text x="-330" y="30" transform="rotate(-90)" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" letter-spacing="0.03em" fill="#eee8d5">Solving Ability (per attempt)</text>

  <!-- Paradigm Shift Discovery: aligned above Human Expert, same x, clear gap, not touching --
       "off the top of the normal scale" is the point, so it sits in the margin above the axis -->
  <circle cx="260" cy="90" r="20" fill="#268bd2" filter="url(#dotSoftGlow2)"/>
  <text x="260" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#268bd2">Paradigm Shift</text>
  <text x="260" y="69" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#268bd2">Discovery</text>

  <!-- Human Expert region: squat oval, blue now, stays clear of the y-axis, label sits
       inside the region itself -->
  <ellipse cx="260" cy="230" rx="140" ry="60" fill="#268bd2" opacity="0.22" filter="url(#regionBlur)"/>
  <ellipse cx="260" cy="230" rx="140" ry="60" fill="none" stroke="#268bd2" stroke-width="2" stroke-dasharray="6 5" opacity="0.6"/>
  <text x="260" y="235" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" font-style="italic" fill="#268bd2" opacity="0.95">Human Expert</text>

  <!-- Math/CS (one-shot) -- vertical oval, widened toward the left (toward the "1 attempt"
       y-axis) while keeping the same height and roughly the same right edge, reaching
       further up into the Human Expert region than a simple circle would, while its
       lower half still sits outside it.
       Color = ~90 public one-shot examples, recomputed against the verified nmax=97
       (see Math/CS Lean-harness below) rather than the earlier unverified ~200 guess. -->
  <ellipse cx="164" cy="270" rx="40" ry="35" fill="#DB342E" filter="url(#dotSoftGlow2)"/>
  <text x="164" y="325" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DB342E">Math/CS</text>
  <text x="164" y="344" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#DB342E">(one-shot)</text>

  <!-- Math/CS (Lean-harness) -- many attempts, nudged left a little. Color = 97 public
       examples, the verified Lean-verified/checked count from our own VibeMathed pull
       (not the earlier ~200 guess) -- the reddest dot, and the scale's own max. -->
  <circle cx="510" cy="445" r="20" fill="#DC322F" filter="url(#dotSoftGlow2)"/>
  <text x="510" y="485" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DC322F">Math/CS</text>
  <text x="510" y="504" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#DC322F">(Lean-harness)</text>

  <!-- Physics -- ~3 public non-empirical LLM examples found (gluon-amplitude, cosmic-string
       radiation, pre-1900-text-LLM rediscovery study) -- green, low count. -->
  <circle cx="440" cy="475" r="18" fill="#9A800B" filter="url(#dotSoftGlow2)"/>
  <text x="440" y="438" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#9A800B">Physics</text>

  <!-- Cybersecurity -- public count revised up: OpenAI (1), Anthropic (3), Google Gemini CLI
       (2 vuln families, Jan 2026), Meta (1, discounted) = ~6-7 disclosed. Still far below Math's
       volume, but warmer than Physics/Biology, and the user's hunch (labs likely underreport) is
       plausible -- placed closer to red than the raw public count alone would justify. -->
  <circle cx="580" cy="405" r="19" fill="#AA6D14" filter="url(#dotSoftGlow2)"/>
  <text x="580" y="368" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#AA6D14">Cybersecurity</text>

  <!-- Computational Biology -- thinnest category: GeneBench-Pro is a capability benchmark
       (<1/3 solved at max compute), not a list of non-empirical discoveries -- genuinely
       couldn't find 3-5 clean examples meeting the non-empirical/LLM/non-human-assist bar.
       Greenest dot, fewer public examples than even Physics. -->
  <circle cx="630" cy="500" r="17" fill="#8D9004" filter="url(#dotSoftGlow2)"/>
  <text x="630" y="470" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#8D9004">Computational Biology</text>

  <!-- color legend: number of public examples, green (few) to red (many), log-scaled --
       tucked into the clear space upper-right, away from every other element -->
  <text x="600" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#eee8d5">Number of Public Examples</text>
  <rect x="520" y="138" width="160" height="14" fill="url(#exampleGradient)" rx="3"/>
  <text x="520" y="168" text-anchor="start" font-family="Inter, sans-serif" font-size="12" fill="#93a1a1">Few</text>
  <text x="680" y="168" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#93a1a1">Many (log scale)</text>
</svg>
