<!--
  JS-driven diagram for the "Ingredients of an LLM" embeddings sequence,
  spanning three consecutive stages that all share one persistent panel:
  stage 2 "embeddings" (3 axes, "king" as the one vector from the shared
  origin) -> stage 3 "vector-math" (axes hidden; king unchanged; man/
  woman/queen fade in as their own vectors from the same origin, plus a
  dashed "-man, +woman" path from king's tip landing on queen) -> stage 4
  "latent-space" (word vectors fade back out; axes return; x/z genuinely
  rotate and v4/v5 fade in once settled).

  Why this exists instead of auto-animate: reveal.js auto-animate cannot
  interpolate the `transform` property at all on matched (data-id) elements
  -- confirmed via direct testing, see AGENT-BRIEFING.md. The fix is to stop
  asking auto-animate to do it: build the axis lines/labels once via
  document.createElementNS (not static markup) and drive their rotation
  entirely with a plain CSS `transition: transform`.

  The visible panel is NOT inside .reveal .slides at all -- it's a single
  persistent, `position: fixed` element appended to <body>, repositioned on
  top of an invisible `.llm-axes-anchor` placeholder (one per stage, in the
  qmd) every time the current slide changes. This took two earlier failed
  attempts to get right, both documented in AGENT-BRIEFING.md:
    1. First attempt reparented the real content into a per-stage mount
       <div> living inside the section. Reveal's auto-animate faded the
       WHOLE mount in/out because an unmatched element (no data-id) between
       two auto-animate slides gets its documented default fade treatment.
    2. Second attempt gave the mount a matching data-id to stop that fade.
       This made things *worse*: once the mount became a matched element,
       reveal started recursing into its subtree looking for ITS OWN
       unmatched descendants, found our un-data-id'd line/label elements,
       and started driving its own independent opacity transition on them
       -- fighting our JS-driven one on the very same elements. That's what
       looked like axes randomly "dropping in" on navigation.
  The only reliable fix is what's here: keep the whole diagram outside
  anything reveal's auto-animate scan ever walks, so neither failure mode
  can happen regardless of what auto-animate's internal matching decides.
  The anchor's only job is reserving layout space (via a matching CSS
  height) inside the two-column row; it renders nothing, so it plainly
  doesn't matter if auto-animate marks it unmatched/fades it.
-->
<script>
(function () {
  // Quarto's preview live-reload patches the DOM in place to preserve the
  // user's current slide position instead of doing a hard page reload,
  // which re-executes this inline <script> on every edit+render without
  // clearing the previous run's state. Without this guard, each
  // re-execution builds its own separate persistent <svg> and registers
  // its own 'slidechanged' listener, and they pile up and fight over the
  // same mount -- symptoms look like duplicate/stale axes, one instance
  // snapping instead of animating, elements "dropping in" out of nowhere.
  // A hard refresh (not live-reload) clears this, since it resets `window`.
  if (window.__llmAxesAnimInitialized) return;
  window.__llmAxesAnimInitialized = true;

  var SVG_NS = 'http://www.w3.org/2000/svg';
  var ORIGIN = { x: 300, y: 340 };

  var AXES_CFG = {
    x:  { color: '#268bd2', radius: 220 },
    y:  { color: '#2aa198', radius: 227 },
    z:  { color: '#b58900', radius: 228 },
    v4: { color: '#6c71c4', radius: 200 },
    v5: { color: '#859900', radius: 195 }
  };
  var AXIS_ORDER = ['x', 'y', 'z', 'v4', 'v5'];

  // No letter labels on any axis -- they read as a literal "these are the
  // semantic dimensions" claim we don't actually want to make; the lines
  // alone still carry the two things that matter (relative angle, and
  // "there are 5 of them now, not 3"). y is intentionally identical
  // (angle) across all three stages -- it's the one axis that should read
  // as completely stationary while x/z rotate and v4/v5 fade in.
  //
  // x/y/z are fully hidden (not just dimmed) during vector-math, not shown
  // at any opacity: there's no real basis/coordinate system to speak of in
  // an embedding space (any basis you'd draw is arbitrary up to rotation,
  // carries no fixed meaning -- these lines were only ever generic
  // plotting scaffolding), and showing them at all during the king/queen
  // demo implies more structure than exists, competing with the actual
  // content (king/man/woman/queen's own vectors) for attention. They
  // return at full opacity exactly as the rotation into latent-space
  // begins. v4/v5's angles are shared across the two stages they can
  // appear in (only opacity changes) so they fade in already in their
  // final position instead of popping. v4 sits close to z (20deg
  // clockwise/"to the right", not mirrored -- that reads as ambiguous
  // rather than close) and v5 close to x -- a deliberately small gap, not
  // fully coincident, to read as "nearly parallel, not exactly
  // orthogonal", the actual point of this diagram (relaxed/near-
  // orthogonality, not identical vectors).
  var STAGES = {
    embeddings: {
      x:  { angle: 147.7, opacity: 1 },
      y:  { angle: 30,    opacity: 1 },
      z:  { angle: -90,   opacity: 1 },
      v4: { angle: -80,   opacity: 0 },
      v5: { angle: 135,   opacity: 0 }
    },
    // x/y/z angles here are identical to `embeddings` -- deliberately no
    // rotation on this transition. The rotation is reserved for the NEXT
    // transition (into latent-space), where it visually marks the pivot
    // from "meaning is geometric" to "and this geometry is denser than
    // plain orthogonality allows".
    'vector-math': {
      x:  { angle: 147.7, opacity: 0 },
      y:  { angle: 30,    opacity: 0 },
      z:  { angle: -90,   opacity: 0 },
      v4: { angle: -80,   opacity: 0 },
      v5: { angle: 135,   opacity: 0 }
    },
    'latent-space': {
      x:  { angle: 159.9, opacity: 1 },
      y:  { angle: 30,    opacity: 1 },
      z:  { angle: -100,  opacity: 1 },
      v4: { angle: -80,   opacity: 1 },
      v5: { angle: 135,   opacity: 1 }
    }
  };

  // king/man/woman/queen, each drawn as a genuine vector from the shared
  // origin -- not just a labeled point. This is the standard illustration
  // for this specific analogy (confirmed against multiple real references,
  // not guessed): solid vectors from a common origin for each word, plus a
  // dashed "-man, +woman" path from king's tip showing the arithmetic as
  // an actual walked path, landing on queen. queen's position is DERIVED
  // (king - man + woman), not hand-placed, so the dashed path is
  // guaranteed to close exactly on it regardless of how king/man/woman get
  // tuned later. "king" is the through-line from stage 2: present in both
  // embeddings and vector-math at this identical position, so it never
  // moves or fades between those two stages -- it's the same vector, not
  // a replacement. tense (walk/walked/swim/swam) is dropped for now to
  // keep this first pass legible -- add back later if there's room.
  var EMB_VM = { embeddings: true, 'vector-math': true, 'latent-space': false };
  var VM_ONLY = { embeddings: false, 'vector-math': true, 'latent-space': false };
  var ORIGIN_PRESENT = { embeddings: true, 'vector-math': true, 'latent-space': true };
  var GENDER_COLOR = '#268bd2';
  var CHAIN_COLOR = '#eee8d5';

  // Long, distinctly-angled vectors using the whole canvas now that
  // there's no axis to avoid crossing -- short vectors clustered near the
  // origin read as small/cramped no matter how the panel is sized. Found
  // by search rather than hand-picked: the "bend" point of the -man/+woman
  // chain (see below) also needs to clear every other point by a healthy
  // margin, which isn't obvious to satisfy by hand alongside the canvas
  // bounds -- this set keeps every pairwise distance (king/man/woman/
  // queen/bend, all 10 pairs) above 220 units.
  var KING = { x: 433, y: 287 };
  var MAN = { x: 242, y: 123 };
  var WOMAN = { x: 81, y: 279 };
  var QUEEN = { x: KING.x - MAN.x + WOMAN.x, y: KING.y - MAN.y + WOMAN.y };

  var WORD_POINTS = {
    // king/man use the default (above, right-anchored) placement -- both
    // of king's lines (its own origin-vector, the outgoing -man segment)
    // approach/exit below it, and man has nothing else nearby.
    king:  { x: KING.x,  y: KING.y,  present: EMB_VM },
    man:   { x: MAN.x,   y: MAN.y,   present: VM_ONLY },
    // woman's own origin-vector approaches from the lower-right, so the
    // default right-side label would sit in its path -- force left.
    woman: { x: WOMAN.x, y: WOMAN.y, present: VM_ONLY, labelPos: 'left' },
    // queen has TWO incoming lines (its own origin-vector from the
    // upper-right, and the dashed +woman segment from the lower-right) --
    // force left to clear both.
    queen: { x: QUEEN.x, y: QUEEN.y, present: VM_ONLY, labelPos: 'left' }
  };

  var svg = null;
  var visiblePanel = null;
  var axisEls = {};
  var originEl = null;
  var wordPointEls = {};
  var arrowEls = [];
  var currentAxesStage = null;

  function ns(tag) {
    return document.createElementNS(SVG_NS, tag);
  }

  function buildSvgOnce() {
    if (svg) return svg;

    visiblePanel = document.createElement('div');
    visiblePanel.className = 'llm-axes-visible-panel';
    visiblePanel.style.display = 'none';
    document.body.appendChild(visiblePanel);

    svg = ns('svg');
    svg.setAttribute('viewBox', '0 0 600 600');
    svg.setAttribute('width', '560');
    svg.setAttribute('height', '560');
    svg.classList.add('llm-axes-svg');

    var defs = ns('defs');
    AXIS_ORDER.forEach(function (id) {
      var marker = ns('marker');
      marker.setAttribute('id', 'llm-axes-arrow-' + id);
      marker.setAttribute('viewBox', '0 0 10 10');
      marker.setAttribute('refX', '8');
      marker.setAttribute('refY', '5');
      marker.setAttribute('markerWidth', '8');
      marker.setAttribute('markerHeight', '8');
      marker.setAttribute('orient', 'auto-start-reverse');
      var path = ns('path');
      path.setAttribute('d', 'M0,0 L10,5 L0,10 z');
      path.setAttribute('fill', AXES_CFG[id].color);
      marker.appendChild(path);
      defs.appendChild(marker);
    });
    svg.appendChild(defs);

    AXIS_ORDER.forEach(function (id) {
      var cfg = AXES_CFG[id];
      var line = ns('line');
      line.setAttribute('x1', '0');
      line.setAttribute('y1', '0');
      line.setAttribute('x2', String(cfg.radius));
      line.setAttribute('y2', '0');
      line.setAttribute('stroke', cfg.color);
      line.setAttribute('stroke-width', '3');
      line.setAttribute('marker-end', 'url(#llm-axes-arrow-' + id + ')');
      line.classList.add('llm-axes-line');
      line.dataset.axis = id;
      line.style.transformOrigin = '0px 0px';
      svg.appendChild(line);
      axisEls[id] = { line: line };
    });

    // The origin dot serves double duty: the axes' shared pivot point in
    // embeddings/latent-space, and the shared start point for king/man/
    // woman/queen's own vectors in vector-math -- same physical point on
    // screen either way, always visible now, just anchoring different
    // content depending on the stage.
    originEl = ns('circle');
    originEl.setAttribute('cx', String(ORIGIN.x));
    originEl.setAttribute('cy', String(ORIGIN.y));
    originEl.setAttribute('r', '5');
    originEl.setAttribute('fill', '#eee8d5');
    originEl.classList.add('llm-fade-el');
    svg.appendChild(originEl);

    var arrowDefs = ns('defs');
    [['llm-arrow-gender', GENDER_COLOR], ['llm-arrow-chain', CHAIN_COLOR]].forEach(function (m) {
      var marker = ns('marker');
      marker.setAttribute('id', m[0]);
      marker.setAttribute('viewBox', '0 0 10 10');
      marker.setAttribute('refX', '8');
      marker.setAttribute('refY', '5');
      marker.setAttribute('markerWidth', '7');
      marker.setAttribute('markerHeight', '7');
      marker.setAttribute('orient', 'auto-start-reverse');
      var path = ns('path');
      path.setAttribute('d', 'M0,0 L10,5 L0,10 z');
      path.setAttribute('fill', m[1]);
      marker.appendChild(path);
      arrowDefs.appendChild(marker);
    });
    svg.appendChild(arrowDefs);

    // Each word as a genuine solid vector FROM the origin -- the primary
    // visual now, not just a labeled dot.
    Object.keys(WORD_POINTS).forEach(function (word) {
      var pt = WORD_POINTS[word];
      var line = ns('line');
      line.setAttribute('x1', String(ORIGIN.x));
      line.setAttribute('y1', String(ORIGIN.y));
      line.setAttribute('x2', String(pt.x));
      line.setAttribute('y2', String(pt.y));
      line.setAttribute('stroke', GENDER_COLOR);
      line.setAttribute('stroke-width', '3.5');
      line.setAttribute('marker-end', 'url(#llm-arrow-gender)');
      line.classList.add('llm-fade-el');
      svg.appendChild(line);
      wordPointEls[word] = { point: line };
    });

    // The dashed grey "-man, +woman" path: starts at king's tip, walks
    // backward by man's vector, then forward by woman's vector, landing
    // exactly on queen's tip (guaranteed by construction, see QUEEN
    // above). This is what actually shows the arithmetic happening, as an
    // honest walked path rather than an implied/labeled relationship.
    var bend = { x: KING.x + ORIGIN.x - MAN.x, y: KING.y + ORIGIN.y - MAN.y };
    [
      { from: KING, to: bend, symbol: '− man' },
      { from: bend, to: QUEEN, symbol: '+ woman' }
    ].forEach(function (seg) {
      var line = ns('line');
      line.setAttribute('x1', String(seg.from.x));
      line.setAttribute('y1', String(seg.from.y));
      line.setAttribute('x2', String(seg.to.x));
      line.setAttribute('y2', String(seg.to.y));
      line.setAttribute('stroke', CHAIN_COLOR);
      line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-dasharray', '5,4');
      line.setAttribute('marker-end', 'url(#llm-arrow-chain)');
      line.classList.add('llm-fade-el');
      svg.appendChild(line);
      arrowEls.push(line);

      var mx = (seg.from.x + seg.to.x) / 2;
      var my = (seg.from.y + seg.to.y) / 2;
      var dx = seg.to.x - seg.from.x, dy = seg.to.y - seg.from.y;
      var len = Math.sqrt(dx * dx + dy * dy);
      var label = ns('text');
      label.setAttribute('x', String(mx - (dy / len) * 14));
      label.setAttribute('y', String(my + (dx / len) * 14));
      label.setAttribute('text-anchor', 'middle');
      label.setAttribute('font-size', '20');
      label.setAttribute('font-weight', '700');
      label.setAttribute('font-style', 'italic');
      label.setAttribute('fill', CHAIN_COLOR);
      label.textContent = seg.symbol;
      label.classList.add('llm-fade-el');
      svg.appendChild(label);
      arrowEls.push(label);
    });

    Object.keys(WORD_POINTS).forEach(function (word) {
      var pt = WORD_POINTS[word];

      var circle = ns('circle');
      circle.setAttribute('cx', String(pt.x));
      circle.setAttribute('cy', String(pt.y));
      circle.setAttribute('r', '8');
      circle.setAttribute('fill', '#eee8d5');
      circle.setAttribute('stroke', GENDER_COLOR);
      circle.setAttribute('stroke-width', '2.5');
      circle.classList.add('llm-fade-el');
      svg.appendChild(circle);

      // Default: label above-right, or above-left (anchor "end") once the
      // point is past the panel's horizontal midpoint, so it doesn't run
      // off the right edge. `labelPos` overrides this for points whose
      // default side would collide with their own vector's approach path
      // or the dashed chain -- 'below' (king: vector exits up, chain
      // exits down-right) or 'right' (queen: both its own vector and the
      // dashed chain approach from lower-left, so force the label right
      // even past the midpoint threshold).
      var label = ns('text');
      if (pt.labelPos === 'below') {
        label.setAttribute('x', String(pt.x));
        label.setAttribute('y', String(pt.y + 30));
        label.setAttribute('text-anchor', 'middle');
      } else if (pt.labelPos === 'right') {
        label.setAttribute('x', String(pt.x + 16));
        label.setAttribute('y', String(pt.y - 12));
      } else {
        var labelOnLeft = pt.x > 470;
        label.setAttribute('x', String(pt.x + (labelOnLeft ? -16 : 16)));
        label.setAttribute('y', String(pt.y - 12));
        if (labelOnLeft) label.setAttribute('text-anchor', 'end');
      }
      label.setAttribute('font-size', '27');
      label.setAttribute('font-weight', '600');
      label.setAttribute('fill', GENDER_COLOR);
      label.textContent = word;
      label.classList.add('llm-fade-el');
      svg.appendChild(label);

      wordPointEls[word].label = label;
      wordPointEls[word].dot = circle;
    });

    // Attached once, permanently -- never reparented again, unlike the
    // earlier mount-based attempt. That also sidesteps the "reparent and
    // restyle in the same tick suppresses the transition" gotcha from
    // AGENT-BRIEFING.md entirely, since there's no more reparenting at all.
    visiblePanel.appendChild(svg);

    return svg;
  }

  // Duration (ms) of each half of the sequenced transition -- must match
  // the CSS `transition: transform <ROTATE_MS>, opacity <FADE_MS>` values
  // in custom.scss. Sequencing (rotate, *then* fade v4/v5 in -- or fade
  // v4/v5 out, *then* rotate back) is done with plain `transition-delay`,
  // not a second reveal stage: this diagram is entirely JS-driven already,
  // so ordering two CSS transitions is just arithmetic on when each one
  // is allowed to start, no extra slide needed.
  var ROTATE_MS = 800;
  var FADE_MS = 500;

  // Extra sequencing for the word-point/arrow fade group on top of the
  // axis rotate/fade logic below -- keyed by the specific adjacent
  // transition, since each direction needs a different wait. "king" is
  // excluded from ever needing this in practice: its presence doesn't
  // change on the embeddings<->vector-math legs, so setting its opacity to
  // the same value again is a no-op regardless of delay. Not covered here
  // (e.g. a direct embeddings<->latent-space jump via overview mode,
  // skipping vector-math) falls back to 0: an uncommon access path,
  // immediate/concurrent is a fine default for it.
  var FADE_SEQUENCE = {
    // queen/man/woman/etc. fade in right away -- nothing needs to clear
    // first now that king just stays put instead of fading out.
    'embeddings->vector-math':   { wordPairDelay: 0 },
    'vector-math->embeddings':   { wordPairDelay: 0 },
    // Word points fade out right as the rotation starts (both run
    // 0-800ms) -- only v4/v5 (handled above) wait for rotation to finish.
    'vector-math->latent-space': { wordPairDelay: 0 },
    // Reverse is fully sequential: v4/v5 fade out (0-500ms), axes rotate
    // back (500-1300ms), THEN word points fade in -- so nothing ever
    // overlaps the moving axes on the way back in.
    'latent-space->vector-math': { wordPairDelay: FADE_MS + ROTATE_MS }
  };

  function applyFade(els, present, delayMs, animate) {
    els.forEach(function (el) {
      if (!animate) {
        el.classList.add('llm-axes-no-transition');
      } else {
        el.style.transitionDelay = delayMs + 'ms';
      }
      el.style.opacity = present ? '1' : '0';
      if (!animate) {
        void el.getBoundingClientRect();
        el.classList.remove('llm-axes-no-transition');
        el.style.transitionDelay = '0ms';
      }
    });
  }

  function applyStage(stageName, animate) {
    var stage = STAGES[stageName];
    if (!stage) return;

    var prevStage = currentAxesStage ? STAGES[currentAxesStage] : null;
    var v4WasShown = prevStage ? prevStage.v4.opacity > 0 : null;
    var v4NowShown = stage.v4.opacity > 0;
    // Forward: rotate x/z first, then fade v4/v5 in once they've settled.
    var enteringExtras = animate && prevStage && !v4WasShown && v4NowShown;
    // Backward: fade v4/v5 out first, then rotate x/z back once they're gone.
    var leavingExtras = animate && prevStage && v4WasShown && !v4NowShown;

    AXIS_ORDER.forEach(function (id) {
      var cfg = stage[id];
      var line = axisEls[id].line;
      var isExtra = (id === 'v4' || id === 'v5');

      if (!animate) {
        line.classList.add('llm-axes-no-transition');
      } else {
        var transformDelay = 0;
        var opacityDelay = 0;
        if (enteringExtras) {
          opacityDelay = isExtra ? ROTATE_MS : 0;
        } else if (leavingExtras) {
          transformDelay = isExtra ? 0 : FADE_MS;
          // x/y/z's dim/undim rides along with their own rotation, not
          // with v4/v5's fade -- they're bundled as one "the axes are
          // doing their thing" unit.
          opacityDelay = isExtra ? 0 : FADE_MS;
        }
        // Order must match the `transition:` property list in custom.scss
        // (transform, then opacity).
        line.style.transitionDelay = transformDelay + 'ms, ' + opacityDelay + 'ms';
      }

      line.style.transform =
        'translate(' + ORIGIN.x + 'px,' + ORIGIN.y + 'px) rotate(' + cfg.angle + 'deg)';
      line.style.opacity = String(cfg.opacity);

      if (!animate) {
        // Force layout so the instant (transition:none) values above are
        // committed before we remove the class -- otherwise the browser can
        // coalesce this with the next style change and transition anyway.
        void line.getBoundingClientRect();
        line.classList.remove('llm-axes-no-transition');
        line.style.transitionDelay = '0ms, 0ms';
      }
    });

    var seqKey = (currentAxesStage || 'none') + '->' + stageName;
    var seq = FADE_SEQUENCE[seqKey] || { wordPairDelay: 0 };

    // Each word has its own per-stage presence ("king" differs from the
    // other 3 -- it's present in both embeddings and vector-math, so this
    // naturally leaves it untouched whenever its presence doesn't change,
    // CSS transitions only kick in when the value actually flips).
    Object.keys(WORD_POINTS).forEach(function (word) {
      var present = WORD_POINTS[word].present[stageName];
      var els = wordPointEls[word];
      applyFade([els.point, els.label, els.dot], present, seq.wordPairDelay, animate);
    });
    applyFade(arrowEls, VM_ONLY[stageName], seq.wordPairDelay, animate);
    applyFade([originEl], ORIGIN_PRESENT[stageName], 0, animate);
  }

  var currentAnchor = null;

  function positionVisiblePanel() {
    if (!currentAnchor) return;
    var rect = currentAnchor.getBoundingClientRect();
    visiblePanel.style.left = rect.left + 'px';
    visiblePanel.style.top = rect.top + 'px';
    visiblePanel.style.width = rect.width + 'px';
    visiblePanel.style.height = rect.height + 'px';
  }

  function handleSlideChange(slideEl) {
    if (!slideEl) return;
    var anchor = slideEl.querySelector('.llm-axes-anchor');
    if (!anchor) {
      currentAxesStage = null;
      currentAnchor = null;
      visiblePanel.style.display = 'none';
      return;
    }
    currentAnchor = anchor;
    visiblePanel.style.display = 'flex';
    positionVisiblePanel();

    var newStage = anchor.dataset.axesStage;
    var animate = currentAxesStage !== null && currentAxesStage !== newStage;
    applyStage(newStage, animate);
    currentAxesStage = newStage;
  }

  function setup() {
    buildSvgOnce();
    handleSlideChange(Reveal.getCurrentSlide());
    Reveal.on('slidechanged', function (event) {
      handleSlideChange(event.currentSlide);
    });
    window.addEventListener('resize', positionVisiblePanel);
  }

  function whenRevealAvailable() {
    if (window.Reveal) {
      if (typeof Reveal.isReady === 'function' && Reveal.isReady()) {
        setup();
      } else {
        Reveal.on('ready', setup);
      }
    } else {
      setTimeout(whenRevealAvailable, 30);
    }
  }

  whenRevealAvailable();
})();
</script>
